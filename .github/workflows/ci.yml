name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# 同 一个 commit 只 留 最新 一 次 跑
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# 改 代码 就 跑 —— 不 需要 模型 权重, 也 不 需要 GPU.
jobs:
  check:
    name: 语法 / 目录 / 泄露 自检
    # 这 几 项 检查 都是 跨平台 的 (纯 文本 / 语法), 所以 用 最 便宜 的 runner.
    # 真 要 跑 模型 得 用 macOS + Apple Silicon —— 那 是 本地 跑 的 事.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Python 语法 (内核 + 引擎)
        run: |
          set -e
          # vendor / vendor_src / ace-step-engine 是 第三方 源码, 原样 保留, 不 编
          python3 -m compileall -q -x '(vendor|vendor_src|ace-step-engine|ref_kernels|__pycache__)' .
          echo "✅ 语法 OK"

      - name: Shell 脚本 语法
        run: |
          set -e
          for f in $(git ls-files '*.sh'); do bash -n "$f"; done
          bash -n install.sh
          bash -n clean.sh
          echo "✅ Shell OK"

      - name: 模型目录 (model_catalog.json) 校验
        run: python3 tools/check_catalog.py

      - name: 不 含 私人 路径 / 内网 地址 / 疑似 key
        # 按 规则 认 (不 点名 任何 人): 家目录 / 内网 IP / 疑似 key
        run: python3 tools/check_private_paths.py

