[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mlx-studio"
version = "1.2.0"
description = "MLX Studio —— 本机 多模态 推理 内核 (出图 / 出歌 / 对话 / 语音) + Studio 控制台"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "MLX Studio" }]
keywords = ["mlx", "apple-silicon", "llm", "image", "music", "tts", "inference"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: MacOS X :: MacOS X",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "numpy>=1.24",
  "mlx>=0.19; sys_platform == 'darwin' and platform_machine == 'arm64'",
]

[project.optional-dependencies]
music = ["torch>=2.3", "diffusers>=0.30"]
voice = ["faster-whisper>=1.0"]
dev = ["pytest>=8"]

[project.urls]
Homepage = "https://github.com/mlx-studio/mlx-studio"
Repository = "https://github.com/mlx-studio/mlx-studio"

[project.scripts]
mlx-studio = "mlx_studio_cli:main"

[tool.setuptools]
py-modules = [
  "server",
  "api_full",
  "cap_engines",
  "engine",
  "image_engine",
  "image_advanced",
  "llm_engine",
  "music_engine",
  "music_mlx",
  "music_proxy",
  "music_workbench",
  "qwen3_tts_engine",
  "voice_convert",
  "ui",
  "outputs",
  "mlx_studio_cli",
]

[tool.setuptools.data-files]
"share/mlx-studio/ui" = ["ui/console.html"]
"share/mlx-studio" = ["model_catalog.json"]
"share/mlx-studio/tools" = [
  "tools/fetch_ace_mlx.py",
  "tools/fetch_minimax_music3.py",
  "tools/fetch_h3_mlx.py",
]
"share/mlx-studio/engines" = ["engines/minimax_music3_service.py"]
