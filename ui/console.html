          const b = Object.assign({}, base, { prompt: sh.prompt, seed: base.seed + i });
          if (sh.first) b.first_frame_image = sh.first;
          if (sh.last) b.last_frame_image = sh.last;
          const r = await api('/v1/video/generations', { method: 'POST', body: b });
          if (r.url) clips.push(r.url);
        }
        out.innerHTML = clips.map(u =>
          `<video src="${esc(u)}" controls preload="metadata" style="max-width:100%;max-height:100%"></video>`).join('');
      } else if ($('#v-story') && $('#v-story').checked) {
        const shots = parseShots(prompt);
        if (!shots.length) {
          note.textContent = '未找到镜头。每个镜头都以类似 === SHOT 1 | 8s === 的一行开头。';
          btn.disabled = false; syncVideoGen(); $('#v-cancel').hidden = true; return;
        }
        const clips = [];
        for (let i = 0; i < shots.length; i++) {
          note.textContent = `生成第 ${i + 1}/${shots.length} 个镜头…`;
          const b = Object.assign({}, base, { prompt: shots[i].text, seed: base.seed + i });
          const r = await api('/v1/video/generations', { method: 'POST', body: b });
          if (r.url) clips.push(r.url);
        }
        out.innerHTML = clips.map(u =>
          `<video src="${esc(u)}" controls preload="metadata" style="max-width:100%;max-height:100%"></video>`).join('');
      } else {
        const r = await api('/v1/video/generations', { method: 'POST', body: Object.assign({}, base, { prompt }) });
        out.innerHTML = '';
        if (r.preview) out.insertAdjacentHTML('beforeend',
          `<img src="data:image/jpeg;base64,${esc(r.preview)}" alt="" style="max-width:100%">`);
        if (r.url) out.insertAdjacentHTML('beforeend',
          `<video src="${esc(r.url)}" controls preload="metadata" style="max-width:100%;max-height:100%"></video>`);
      }
      note.textContent = '完成';
      renderLibrary(); renderRecent('video', 4, 'v-gen-recent');
      refreshModels().then(() => refreshModelCards());
    } catch (e) { note.textContent = '失败：' + e.message; }
    finally { btn.disabled = false; syncVideoGen(); $('#v-cancel').hidden = true; }
  };
  $('#v-cancel').onclick = () => { $('#v-note').textContent = '已取消（当前镜头仍会跑完）'; };
  renderRecent('video', 4, 'v-gen-recent');

}
function parseShots(prompt) {
  const re = /===\s*SHOT\s*(\d+)\s*\|\s*([\d.]+)s\s*===/gi;
  const hits = [];
  let m;
  while ((m = re.exec(prompt)) !== null) hits.push({ i: m.index, len: m[0].length, n: m[1], sec: parseFloat(m[2]) });
  if (!hits.length) return [];
  return hits.map((h, k) => ({
    n: h.n,
    sec: h.sec,
    text: (prompt.slice(h.i + h.len, k + 1 < hits.length ? hits[k + 1].i : prompt.length)).trim(),
  })).filter(s => s.text);
}

    };

  $('#tts-out').innerHTML = `<div class="field-note">引擎: ${esc(r.engine || 'tts')}${r.lang_code ? ' · ' + esc(r.lang_code) : ''}${cloneTag ? ' · ' + cloneTag : ''}</div>${sub}`;
  $('#tts-save').onclick = () => {

async function genMusic(note) {

  const mbody = { prompt: $('#mus-prompt').value, duration_seconds: Number($('#mus-sec').value) || 60 };

// 录音 (浏览器 MediaRecorder → WAV)
async function recordAudio(seconds) {
  const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
  const rec = new MediaRecorder(stream);
  const chunks = [];
  rec.ondataavailable = e => { if (e.data.size) chunks.push(e.data); };
  rec.start();
  await new Promise(r => setTimeout(r, (seconds || 8) * 1000));
  const blob = await new Promise(r => { rec.onstop = r; rec.stop(); });
  stream.getTracks().forEach(t => t.stop());
  const ab = await blob.arrayBuffer();
  return b64encode(new Uint8Array(ab));
}
function b64encode(bytes) {
  let s = '';
  for (let i = 0; i < bytes.length; i++) s += String.fromCharCode(bytes[i]);
  return btoa(s);
}

function parseSubtitle(text) {
  const out = [];
  if (/-->/.test(text)) {
    text.split(/\r?\n\r?\n/).forEach(b => {
      const ls = b.split(/\r?\n/).filter(x => x.trim());
      if (!ls.length) return;
      const t = ls.filter(x => !/-->/.test(x) && !/^\d+$/.test(x.trim()));
      const s = t.join(' ').trim();
      if (s) out.push(s);
    });
  } else {
    text.split(/\r?\n/).forEach(x => { if (x.trim()) out.push(x.trim()); });
  }
  return out;
}

}

  const head = `
    <div class="field-note">${items.length} 条 音轨 · 输出目录 <code>${esc(r.dir || '')}</code></div>
    ${r.joined_audio_url ? `<audio controls src="${esc(r.joined_audio_url)}" style="width:100%"></audio>` : ''}
    ${r.mp3_audio_url ? `<p class="field-note">MP3: <a href="${esc(r.mp3_audio_url)}" download>下载 合集.mp3</a></p>` : ''}
    ${r.video_audio_url ? `<video controls src="${esc(r.video_audio_url)}" style="width:100%;border-radius:8px"></video>` : ''}
    ${r.video_error ? `<p class="field-note">视频 合成 失败：${esc(r.video_error)}</p>` : ''}`;
  const rows = items.map(it => `
    <div class="dub-out">
      <div class="dub-out-idx">${it.index + 1}</div>
      <div class="dub-out-body">
        <div class="dub-out-text">${esc(it.text || '')}</div>
        <audio controls src="${esc(it.audio_url || '')}" style="width:100%"></audio>
      </div>
    </div>`).join('');
  box.innerHTML = head + rows;
}

/* ============================================================ 启动 */
async function boot() {
  loadSessions();
  state.lang = localStorage.getItem('mlx.lang') || 'zh';
  state.theme = localStorage.getItem('mlx.theme') || 'light';
  state.accent = localStorage.getItem('mlx.accent') || 'blue';
  state.textsize = localStorage.getItem('mlx.textsize') || 'default';
  state.compact = localStorage.getItem('mlx.compact') === '1';
  state.chatWidth = parseInt(localStorage.getItem('mlx.chatcol') || '976', 10) || 976;
  state.apiKey = localStorage.getItem('mlx.apikey') || '';
  state.server = localStorage.getItem('mlx.server') || '';
  try { state.servers = JSON.parse(localStorage.getItem('mlx.servers') || '[]') || []; }
  catch (e) { state.servers = []; }
  applyPrefs();
  buildNav();
  $('#menu-btn').onclick = () => $('#sidebar').classList.toggle('open');
  $('#theme-btn').onclick = () => {
    state.theme = state.theme === 'dark' ? 'light' : 'dark';
    localStorage.setItem('mlx.theme', state.theme); applyPrefs();
  };
  $('#lang-btn').onclick = () => {
    state.lang = state.lang === 'zh' ? 'en' : 'zh';
    localStorage.setItem('mlx.lang', state.lang);
    applyLang();
  };
  applyLang();
  renderSessList();
  go(bootPage());
  applyLang();   // 首页 的 气泡 文案 是 go() 里 注入 的, 再 走 一 遍 才 能 换 语种
  setPollRange(state.range || 'live');
  pollMetrics();
  // 开机 就 拉 一次 /props —— 出片 页面 用 它 估 「预计 耗时」(按 上 次 实测 速度)
  api('/props').then(p => {
    window.__props = p;
    // /props 是 异步 到 的 —— 音乐页 的 滑块 上限 (引擎 真 上限) 得 跟着 补 一次
    if (window.__musSyncDurMax) window.__musSyncDurMax();
  }).catch(e => { });
  try {
    const h = await api('/health');
    $('#side-dot').className = 'dot ok';
    $('#side-addr').textContent = location.host + (h.node ? ' · ' + h.node : '');
  } catch (e) {
    $('#side-dot').className = 'dot err';
  }
  // 引擎 可能 被 「闲置 30 分钟 自动 卸载」 掉 —— 定时 同步 「已加载 / 未加载」 状态,
  // 免得 用户 看到 的 还是 旧 状态 (以为 没 卸).  模型页 只 改 状态 变了 的 行.
  setInterval(async () => {
    const p = state.page;
    try {
      if (p === 'models') {
        await refreshModelStates();
      } else if (['image', 'video', 'audio'].indexOf(p) >= 0) {
        if ($$('.image-menu-popup').some(x => !x.hidden)) return;   // 菜单 开着 就 别 重画
        await refreshModels();
        refreshModelCards();
      }
    } catch (e) { /* 忽略 */ }
  }, 15000);
  // 深链: /?say=文本 -> 自动 发 一 条 (端到端 自测 用)
  const q = new URLSearchParams(location.search).get('say');
  if (q) {
    const wait = setInterval(() => {
      if (state.chatModel && $('#input')) {
        clearInterval(wait);
        $('#input').value = q;
        sendMessage();
      }
    }, 400);
  }
  try {
    const mm = await api('/v1/models');
    state.models = mm.data || []; state.byId = {};
    state.models.forEach(r => state.byId[r.id] = r);
    const cm = state.models.filter(r => (r.capabilities || []).includes('chat'));
    if (!state.chatModel && cm.length) state.chatModel = cm[0].id;
    // 注意: 直接 进 启动器 页 时 对话 页 没 渲染 过, #model-name 不存在 ——
    // 原来 这里 直接 取 会 抛 异常, 被 外层 catch 吞掉, 后面 的 代码 全 不 执行
    var mn = $('#model-name'), md = $('#model-dot');
    if (state.chatModel && mn) { mn.textContent = state.chatModel; }
    if (state.chatModel && md) { md.className = 'dot ok'; }
    // 模型 到得 晚 时, 启动器 页 可能 已经 渲染 过 —— 重渲染 一次, 免得 显示 「模型数 0」
    if (state.page === 'launcher') renderLauncher();
  } catch (e) { }
  try { const v = await api('/api/version'); state.version = v.version || ''; } catch (e) { }
  pollMetrics();
}

/* ============ MV 工作台 (关键帧 -> 镜头 -> 拼 成 MV -> 配乐) ============ */
const vMvFrames = [];              // [{name,url,rel,b64}]
let vMvNode = 'local';
let vMvNodes = [];
let vMvMusic = [];
let vMvLoading = false;
let vMvInited = false;

function vMvShots() { return Math.max(0, vMvFrames.length - 1); }

function vMvSync() {
  const box = $('#v-mv-seq'), hint = $('#v-mv-pool-hint');
  if (box) {
    box.innerHTML = vMvFrames.map((f, i) => `
      <figure class="v-mv-frame">
        <img src="${esc(f.url)}" alt="${esc(f.name)}" loading="lazy">
        <span class="v-mv-no">${i + 1}</span>
        <div class="v-mv-ops">
          <button type="button" data-op="left" data-i="${i}" title="往前移" ${i === 0 ? 'disabled' : ''}>←</button>
          <button type="button" data-op="right" data-i="${i}" title="往后移" ${i === vMvFrames.length - 1 ? 'disabled' : ''}>→</button>
          <button type="button" data-op="del" data-i="${i}" title="去掉">×</button>
        </div>
      </figure>`).join('');
    $$('#v-mv-seq .v-mv-ops button').forEach(b => b.onclick = ev => {
      ev.stopPropagation();
      const i = parseInt(b.dataset.i, 10), op = b.dataset.op;
      if (op === 'del') vMvFrames.splice(i, 1);
      else if (op === 'left' && i > 0) {
        const t = vMvFrames[i - 1]; vMvFrames[i - 1] = vMvFrames[i]; vMvFrames[i] = t;
      } else if (op === 'right' && i < vMvFrames.length - 1) {
        const t = vMvFrames[i + 1]; vMvFrames[i + 1] = vMvFrames[i]; vMvFrames[i] = t;
      }
      vMvSync();
    });
  }
  if (hint) hint.textContent = vMvFrames.length
    ? ('已选 ' + vMvFrames.length + ' 张 —— 相邻 两 张 中间 生 一个 镜头，共 ' + vMvShots() + ' 个 镜头')
    : (vMvLoading ? '正在 读 出图 产物…' : '点 上面 的 按钮 挑 几张 图');
  vMvSyncChain();
}

function vMvSyncChain() {
  const box = $('#v-mv-chain'), sum = $('#v-mv-summary'), cnt = $('#v-mv-count');
  const ps = (($('#v-mv-prompts') || {}).value) || '';
  const lines = ps.split('\n').map(x => x.trim()).filter(Boolean);
  const shots = vMvShots();
  if (box) {
    if (!shots) {
      box.innerHTML = '<div class="v-pair-empty">挑 完 关键帧 之后，这里 会 一 张 一 张 列出「哪张 当 首帧、哪张 当 尾帧」</div>';
    } else {
      box.innerHTML = vMvFrames.slice(0, -1).map((f, i) => `
        <figure class="v-pair">
          <div class="v-pair-imgs">
            <img src="${esc(f.url)}" alt="首帧" loading="lazy">
            <span class="v-arrow">→</span>
            <img src="${esc(vMvFrames[i + 1].url)}" alt="尾帧" loading="lazy">
          </div>
          <figcaption class="v-pair-cap"><b>镜头 ${i + 1}</b> · 首→尾${lines.length ? ' · 提示词 ' + (Math.min(i, lines.length - 1) + 1) : ''}</figcaption>
        </figure>`).join('');
    }
  }
  if (sum) sum.textContent = shots ? ('共 ' + shots + ' 个 镜头 · 拼 成 1 支 MV') : '';
  if (cnt) cnt.textContent = shots
    ? ('提示词 ' + lines.length + ' 条 —— 镜头 ' + shots + ' 个' +
      (lines.length ? (lines.length < shots ? '（最后一条会 套用 到底）' : '') : '（没填 就 用 默认）') +
      (shots > 6 ? '　⚠️ ' + shots + ' 个 镜头 一次 要 跑 很 久 —— 建议 先 留 3～6 个' : ''))
    : '';
}

async function vMvLoadPool(replace) {
  const hint = $('#v-mv-pool-hint');
  vMvLoading = true;
  try {
    const r = await api('/v1/video/images');
    if (r && r.items) {
      if (replace) vMvFrames.length = 0;
      const have = new Set(vMvFrames.map(x => x.name));
      (r.items || []).forEach(it => { if (!have.has(it.name)) vMvFrames.push({ name: it.name, url: it.url, rel: it.rel }); });
      if (hint) hint.textContent = '出图 产物 ' + r.count + ' 张';
    }
  } catch (e) {
    if (hint) hint.textContent = '读 不 到 出图 产物：' + e.message;
  }
  vMvLoading = false;
  vMvSync();
}

async function vMvLoadNodes() {
  const box = $('#v-mv-node'), note = $('#v-mv-node-note');
  try {
    const r = await api('/v1/video/nodes');
    vMvNodes = (r && r.nodes) || [];
  } catch (e) {
    vMvNodes = [{ id: 'local', name: '本机', ok: true }];
  }
  // 默 认 用 远端机 出 镜头 (它 出片 快) —— 合并 依然 在 本机
  const rem = vMvNodes.find(n => n.id === 'remote' || n.id === 'remote');
  if (rem && rem.ok) vMvNode = rem.id;
  if (!box) return;
  box.innerHTML = vMvNodes.map(n => `
    <button type="button" data-n="${esc(n.id)}" aria-pressed="${n.id === vMvNode}" ${n.ok ? '' : 'disabled'}>${esc(n.name)}${n.ok ? '' : ' · 连不上'}</button>`).join('');
  $$('#v-mv-node button').forEach(b => b.onclick = () => {
    vMvNode = b.dataset.n;
    $$('#v-mv-node button').forEach(x => x.setAttribute('aria-pressed', String(x === b)));
    vMvSyncNodeNote();
  });

}
function vMvSyncNodeNote() {
  const note = $('#v-mv-node-note');
  if (!note) return;
  const n = vMvNodes.find(x => x.id === vMvNode);
  note.textContent = n
    ? (n.id === 'remote' || n.id === 'remote'
      ? '镜头 在 远端机 出 —— 产物 会 拉 回 本机，本机 负责 拼接 + 配乐。'
      : '镜头 在 本机 出 —— 拼接 + 配乐 也 在 本机。')
    : '';
}

async function vMvLoadMusic() {
  const sel = $('#v-mv-music');
  if (!sel) return;
  try {
    const r = await api('/v1/audio/files');
    vMvMusic = (r && r.items) || [];
  } catch (e) { vMvMusic = []; }
  const cur = sel.value;
  sel.innerHTML = '<option value="">不配乐（只出画面）</option>' +
    vMvMusic.map(m => `<option value="${esc(m.rel)}">${esc(m.name)}</option>`).join('');
  if (cur && vMvMusic.some(m => m.rel === cur)) sel.value = cur;
  const a = $('#v-mv-music-play');
  const syncAudio = () => {
    const m = vMvMusic.find(x => x.rel === sel.value);
    if (a) { a.src = m ? m.url : ''; if (!m) a.removeAttribute('src'); }
  };
  sel.onchange = syncAudio;
  syncAudio();
}

function vMvBind() {
  const refresh = $('#v-mv-refresh');
  if (refresh) refresh.onclick = () => vMvLoadPool(true);
  const add = $('#v-mv-add');
  if (add) add.onclick = () => $('#v-mv-file').click();
  const file = $('#v-mv-file');
  if (file) file.onchange = async e => {
    for (const f of e.target.files) {
      try {
        const b64 = await readFileB64(f);
        vMvFrames.push({ name: f.name, url: URL.createObjectURL(f), b64 });
      } catch (err) { /* 跳过 坏 文件 */ }
    }
    e.target.value = '';
    vMvSync();
  };
  const prompts = $('#v-mv-prompts');
  if (prompts) prompts.oninput = () => vMvSyncChain();
  const sample = $('#v-mv-sample');
  if (sample) sample.onclick = () => {
    const ta = $('#v-mv-prompts');
    if (!ta) return;
    ta.value = [
      '镜头 缓缓 推近 人物 侧脸，暖 黄 侧光，浅 景深，城市 夜景 背景 虚化',
      '镜头 横移 过 霓虹 街道，雨 后 地面 反光，冷 蓝 色调，湿润 空气',
      '镜头 拉远 人物 背影 走进 人群，暖 光 从 背后 洒下，缓慢 收尾',
    ].join('\n');
    vMvSyncChain();
  };
  const go = $('#v-mv-go');
  if (go) go.onclick = vMvGo;
  const stop = $('#v-mv-stop');
  if (stop) stop.onclick = () => {
    state.vidMvJob = null;
    const g = $('#v-mv-go'), st = $('#v-mv-stop'), pg = $('#v-mv-prog');
    if (g) g.disabled = false;
    if (st) st.hidden = true;
    if (pg) pg.hidden = true;
    const log = $('#v-mv-log');
    if (log) log.textContent += '\n—— 已 停止 等待 (引擎 那边 可能 还 在 跑) ——';
  };
}

function vMvInit() {
  vMvBind();                       // 每 次 重画 都 重新 绑 (页面 是 重新 渲染 的)
  if (vMvInited) { vMvSync(); return; }
  vMvInited = true;
  vMvLoadPool(false);
  vMvLoadNodes();
  vMvLoadMusic();
}

async function vMvGo() {
  if (vMvFrames.length < 2) { toast('至少 要 2 张 关键帧'); return; }
  const ps = (($('#v-mv-prompts') || {}).value) || '';
  const lines = ps.split('\n').map(x => x.trim()).filter(Boolean);
  if (!lines.length) lines.push('integrated_multimodal_description: 电影感 镜头 运动，浅 景深，柔和 光线，自然 质感；overall_soundscape: 环境 氛围 音');
  const log = $('#v-mv-log'), prog = $('#v-mv-prog'), hint = $('#v-mv-hint');
  const go = $('#v-mv-go'), stop = $('#v-mv-stop');
  const frames = vMvFrames.map(f => f.rel || f.b64 || '');
  if (frames.some(x => !x)) { toast('有 图 没 读 到 内容 —— 重新 选 一次 那 些 图'); return; }
  const music = (($('#v-mv-music') || {}).value) || '';
  go.disabled = true; stop.hidden = false; prog.hidden = false;
  const wrap = $('#v-mv-final-wrap');
  if (wrap) wrap.hidden = true;
  if (log) log.textContent = '提交 中…';
  try {
    const r = await api('/v1/video/mv', { method: 'POST', body: {
      frames,
      prompts: lines,
      seconds: Math.max(1, Math.min(15, parseFloat((($('#v-mv-sec') || {}).value)) || 5)),
      steps: parseInt((($('#v-mv-steps') || {}).value), 10) || 8,
      width: parseInt((($('#v-mv-w') || {}).value), 10) || 832,
      height: parseInt((($('#v-mv-h') || {}).value), 10) || 480,
      seed: parseInt((($('#v-mv-seed') || {}).value), 10) || 0,
      music,
      node: vMvNode,
    } });
    if (!r.ok) throw new Error(r.error || '提交 失败');
    state.vidMvJob = r.job_id;
    if (hint) hint.textContent = '任务 ' + r.job_id + ' · ' + r.shots + ' 个 镜头 · 出片 ' + (r.node === 'remote' || r.node === 'remote' ? '远端机' : '本机') + ' · 合并 本机';
    vMvPoll();
  } catch (e) {
    if (log) log.textContent = '失败：' + e.message;
    go.disabled = false; stop.hidden = true; prog.hidden = true;
  }
}

function vMvPoll() {
  if (!state.vidMvJob) return;
  api('/v1/video/mv?id=' + encodeURIComponent(state.vidMvJob)).then(r => {
    const log = $('#v-mv-log'), prog = $('#v-mv-prog');
    const go = $('#v-mv-go'), stop = $('#v-mv-stop');
    if (log) log.textContent = (r.log || []).join('\n');
    if (prog) {
      const pct = r.total ? Math.round((r.done / r.total) * 100) : 0;
      prog.querySelector('span').style.width = pct + '%';
    }
    const shots = $('#v-mv-shots');
    if (shots) {
      shots.innerHTML = (r.shots || []).filter(x => x.ok).map(x => `
        <figure class="v-batch-res">
          <video src="${esc(x.url)}" controls preload="metadata"></video>
          <figcaption>镜头 ${x.idx + 1} · ${esc((x.prompt || '').slice(0, 40))}</figcaption>
        </figure>`).join('');
    }
    if (r.mv && r.mv.url) {
      const wrap = $('#v-mv-final-wrap'), vid = $('#v-mv-final'), note = $('#v-mv-final-note');
      if (wrap) wrap.hidden = false;
      if (vid && vid.getAttribute('src') !== r.mv.url) vid.src = r.mv.url;
      if (note) note.textContent = ' · ' + (r.shots || []).length + ' 个 镜头 · ' + (r.node === 'remote' || r.node === 'remote' ? '远端机 出片 / 本机 合并' : '本机 出片 / 本机 合并');
    }
    if (r.status === 'running') { setTimeout(vMvPoll, 2000); return; }
    state.vidMvJob = null;
    if (go) go.disabled = false;
    if (stop) stop.hidden = true;
    if (prog) prog.hidden = true;
    if (log) log.textContent += '\n—— 结束 (' + r.done + '/' + r.total + ') ——';
    if (r.out_dir) toast('产出 目录：' + r.out_dir);
    renderLibrary();
  }).catch(() => {
    state.vidMvJob = null;
    const go = $('#v-mv-go'), stop = $('#v-mv-stop'), prog = $('#v-mv-prog');
    if (go) go.disabled = false;
    if (stop) stop.hidden = true;
    if (prog) prog.hidden = true;
  });
}

function bindMusicCreate() {
  const dur = $('#mus-dur-in'), out = $('#mus-dur-out');
  if (dur && out) {
    dur.oninput = () => { out.textContent = dur.value; };
  }
  // —— 自动时长: 按 歌词 结构 算 —— 内核 算, 这里 只 显示 ——
  const autoBox = $('#mus-dur-auto'), durNote = $('#mus-dur-note');
  const musMaxDur = () => {
    const p = (window.__props && window.__props.settings) || {};
    return Math.max(30, Math.round(p.music_max_duration || 480));
  };
  const syncDurMax = () => {
    if (dur) dur.max = String(musMaxDur());
  };
  window.__musSyncDurMax = syncDurMax;
  syncDurMax();
  let durTimer = null;
  const refreshAuto = () => {
    if (!autoBox || !autoBox.checked) {
      if (dur) dur.disabled = false;
      if (durNote) durNote.textContent = '';
      if (dur && out) out.textContent = dur.value;
      return;
    }
    const lyrics = (($('#mus-lyrics-in') || {}).value) || '';
    const inst = (($('#mus-inst-in') || {}).checked) || false;
    const base = (state.server && state.server !== location.origin) ? state.server : '';
    fetch(base + '/v1/music/duration', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ lyrics, instrumental: inst }),
    }).then(r => r.json()).then(j => {
      if (!j || j.error) return;
      const sec = Math.round(j.seconds || 0);
      if (dur) { dur.value = String(sec); dur.disabled = true; }
      if (out) out.textContent = String(sec);
      if (durNote) durNote.textContent = '自动 → ' + sec + ' 秒（' + (j.reason || '') + '）· 引擎上限 ' + (j.max || musMaxDur()) + ' 秒';
    }).catch(() => {});
  };
  const scheduleAuto = () => {
    if (durTimer) clearTimeout(durTimer);
    durTimer = setTimeout(refreshAuto, 350);
  };
  if (autoBox) {
    autoBox.onchange = refreshAuto;
    const ly = $('#mus-lyrics-in'), ib = $('#mus-inst-in');
    if (ly) ly.oninput = scheduleAuto;
    if (ib) ib.onchange = scheduleAuto;
  }
  window.__musRefreshAuto = refreshAuto;
  // —— 模板 / 段落 / 增强 ——
  wireTemplateMenu('mus-tpl-btn', 'mus-tpl-menu', 'mus-prompt-in', [
    ['Lo-fi', 'lofi hip hop, warm rhodes piano, dusty drums, vinyl crackle, rainy night'],
    ['电子', 'upbeat synthwave with driving bass and dreamy pads, 120 bpm'],
    ['电影', 'orchestral cinematic score, slow build, cello and piano, wide strings'],
    ['爵士', 'smooth jazz trio, upright bass brushes, muted trumpet, smoky club'],
    ['国风', 'chinese style, pentatonic guzheng, erhu, soft strings, 90 bpm'],
    ['说唱', 'boom bap trap, 808 bass, dark minor key, 140 bpm'],
  ]);
  wireTemplateMenu('mus-tpl2-btn', 'mus-tpl2-menu', 'mus-lyrics-in', [
    ['标准结构', '[intro]\n[verse]\n[chorus]\n[bridge]\n[outro]'],
    ['纯器乐', '[intro]\n[instrumental]\n[outro]'],
  ]);
  const enBtn = $('#mus-enhance');
  if (enBtn) enBtn.onclick = () => enhancePrompt('mus-prompt-in', 'mus-enhance');
  // 标签 多选
  $$('#page-music .music-tag').forEach(b => b.onclick = () => {
    const t = b.dataset.tag;
    const cur = state.musTags || [];
    const i = cur.indexOf(t);
    if (i >= 0) cur.splice(i, 1); else cur.push(t);
    state.musTags = cur;
    b.setAttribute('aria-pressed', String(i < 0));
  });
  const go = $('#mus-go');
  if (go) go.onclick = () => musicGenerate();
  const cancel = $('#mus-cancel');
  if (cancel) cancel.onclick = () => {
    if (state.musAbort) { state.musAbort.abort(); state.musAbort = null; }
  };
  bindMusicEngine();
  bindMusicRadio();
  renderRecent('audio', 6, 'mus-gen-recent');
}

// —— 出歌 引擎 条: 选 模型 / 加载 / 卸载 ——
async function bindMusicEngine() {
  const sel = $('#mus-model-sel'), note = $('#mus-engine-note');
  const load = $('#mus-load'), unload = $('#mus-unload');
  if (!sel) return;
  let list = [];
  try {
    const r = await api('/v1/models');
    list = (r.data || []).filter(m => (m.capabilities || []).indexOf('music') >= 0)
      .filter(m => !m.hidden);
  } catch (e) { list = []; }
  sel.innerHTML = list.length ? list.map(optMusicModel).join('') : '<option value="">没有 出歌 模型</option>';
  const upd = async () => {
    if (!note) return;
    try {
      const h = await api('/v1/music/health');
      if (!h.mlx) note.textContent = '出歌 模型 不 在 —— 出歌 会 降级 到 ACE-Step (慢)';
      else if (h.loaded) note.textContent = '已 挂载 · ' + (h.model_name || h.model || 'MLX 出歌 引擎');
      else note.textContent = '未 挂载 · 出歌 时 自动 加载 (第一首 多 几 秒)';
    } catch (e) { note.textContent = '引擎 状态 未知'; }
  };
  upd();
  bindMusicEngineButtons(load, unload, sel, upd);
}

function optMusicModel(m) {
  return '<option value="' + esc(m.id) + '"' + (m.loaded ? ' selected' : '') + '>'
    + esc(m.name || m.id) + (m.loaded ? ' · 已 挂载' : '') + '</option>';
}

function bindMusicEngineButtons(load, unload, sel, upd) {
  if (load) load.onclick = async () => {
    load.disabled = true; load.textContent = '加载中…';
    try {
      const r = await api('/v1/load-model', { method: 'POST', body: { model: sel.value, capability: 'music' } });
      toastLong('已 加载 ' + ((r && r.model) || sel.value) + (r && r.note ? ' · ' + r.note : ''));
      await upd();
    } catch (e) { toast('加载 失败：' + e.message); }
    finally { load.disabled = false; load.textContent = '加载'; }
  };
  if (unload) unload.onclick = async () => {
    unload.disabled = true;
    try {
      const r = await api('/v1/unload-model', { method: 'POST', body: { model: sel.value, capability: 'music' } });
      toastLong('已 卸载' + (r && r.note ? ' · ' + r.note : ''));
      await upd();
    } catch (e) { toast('卸载 失败：' + e.message); }
    finally { unload.disabled = false; }
  };
}

// —— AI 电台 (播放器 + 电台 主题 + 循环 / 随机 / 上下一首) ——
function bindMusicRadio() {
  const radio = { on: false, timer: null, n: 0, audio: null, tracks: [], idx: -1,
    shuffle: false, loop: true, vol: 0.8 };
  const radioPlay = (i) => {
    if (!radio.tracks.length) return;
    radio.idx = (i + radio.tracks.length) % radio.tracks.length;
    const t = radio.tracks[radio.idx];
    if (radio.audio) { radio.audio.pause(); radio.audio = null; }
    radio.audio = new Audio(t.url);
    radio.audio.volume = radio.vol;
    radio.audio.onended = () => {
      if (!radio.on) return;
      if (radio.loop) radioPlay(radio.idx);
      else radioTick();
    };
    radio.audio.ontimeupdate = () => {
      const bar = $('#radio-progress');
      if (bar && radio.audio && radio.audio.duration) {
        bar.style.width = (radio.audio.currentTime / radio.audio.duration * 100).toFixed(1) + '%';
      }
    };
    radio.audio.play().catch(() => {});
    $('#mus-title').textContent = '第 ' + t.n + ' 首 · ' + $('#radio-theme').value;
    $('#radio-note').textContent = '播放中 · 第 ' + t.n + ' 首';
  };
  const radioTick = async () => {
    if (!radio.on) return;
    radio.n++;
    $('#radio-note').textContent = '正在 作曲… (' + radio.n + ')';
    const theme = $('#radio-theme').value || '舒缓 lo-fi';
    const prompt = radio.shuffle ? theme + '，变奏 ' + radio.n + '，不同 配器 与 律动' : theme;
    try {
      const r = await api('/v1/music/generate', { method: 'POST', body: {
        prompt, duration_seconds: 60, instrumental: true,
        seed: Math.floor(Math.random() * 4294967295),
      } });
      if (!radio.on) return;
      const it = (r.data || [])[0] || {};
      if (!it.b64_json) { $('#radio-note').textContent = '没有 拿到 音频'; return; }
      const url = 'data:' + audioMime(it.url, 'audio/mpeg') + ';base64,' + it.b64_json;
      const row = document.createElement('div');
      row.innerHTML = '<span>第 ' + radio.n + ' 首</span><span class="mono">' + new Date().toLocaleTimeString() + '</span>';
      $('#radio-list').prepend(row);
      radio.tracks.push({ n: radio.n, url: url });
      radioPlay(radio.tracks.length - 1);
    } catch (e) {
      if (!radio.on) return;
      $('#radio-note').textContent = '失败：' + e.message + ' · 5s 后 重试';
      radio.timer = setTimeout(radioTick, 5000);
    }
  };
  const on = (id, fn) => { const b = $('#' + id); if (b) b.onclick = fn; };
  on('radio-go', () => {
    if (radio.on) return;
    radio.on = true; radio.n = 0;
    $('#radio-note').textContent = '正在 构思…';
    radioTick();
  });
  on('radio-stop', () => {
    radio.on = false;
    if (radio.timer) clearTimeout(radio.timer);
    if (radio.audio) { radio.audio.pause(); radio.audio = null; }
    $('#radio-note').textContent = '停止';
  });
  on('radio-toggle', () => {
    if (!radio.on) { if (radio.tracks.length) { radio.on = true; radioPlay(radio.idx); } else $('#radio-go').click(); return; }
    if (!radio.audio) return;
    if (radio.audio.paused) { radio.audio.play().catch(() => {}); $('#radio-note').textContent = '播放中'; }
    else { radio.audio.pause(); $('#radio-note').textContent = '已 暂停'; }
  });
  on('radio-prev', () => { if (radio.tracks.length) radioPlay(radio.idx - 1); });
  on('radio-next', () => { if (radio.tracks.length) radioPlay(radio.idx + 1); });
  on('radio-shuffle', (e) => {
    radio.shuffle = !radio.shuffle;
    e.currentTarget.setAttribute('aria-pressed', String(radio.shuffle));
    $('#radio-note').textContent = radio.shuffle ? '随机 开' : '随机 关';
  });
  on('radio-loop', (e) => {
    radio.loop = !radio.loop;
    e.currentTarget.setAttribute('aria-pressed', String(radio.loop));
  });
  const vol = $('#radio-vol');
  if (vol) vol.oninput = (e) => {
    radio.vol = Number(e.target.value) / 100;
    if (radio.audio) radio.audio.volume = radio.vol;
  };
}

async function musicGenerate() {
  const prompt = ($('#mus-prompt-in') || {}).value || '';
  const lyrics = ($('#mus-lyrics-in') || {}).value || '';
  const title = (($('#mus-title-in') || {}).value || '').trim();
  const inst = (($('#mus-inst-in') || {}).checked) || false;
  const tags = musSelectedTags();
  if (!prompt.trim() && !lyrics.trim()) { toast('先 填 提示词 或 歌词'); return; }
  const body = {
    prompt: (prompt.trim() + (tags ? ', ' + tags : '')).trim(),
    lyrics: inst ? '' : lyrics,
    instrumental: inst,
    title: title,
    duration_seconds: (($('#mus-dur-auto') || {}).checked)
      ? 'auto' : Number((($('#mus-dur-in') || {}).value) || 60),
  };
  // 用 引擎 条 上 选 的 出歌 模型 (我们 自研 的 那 两个)
  const msel = ($('#mus-model-sel') || {}).value || '';
  if (msel) body.model = msel;
  const seed = (($('#mus-seed-in') || {}).value || '').trim();
  if (seed) body.seed = parseInt(seed, 10);
  const bpm = (($('#mus-bpm-in') || {}).value || '').trim();
  if (bpm) body.bpm = parseInt(bpm, 10);
  const key = (($('#mus-key-in') || {}).value || '').trim();
  if (key) body.keyscale = key;
  const sig = (($('#mus-sig-in') || {}).value || '').trim();
  if (sig) body.timesignature = sig;
  const lang = (($('#mus-lang-in') || {}).value || '').trim();
  if (lang) body.vocal_language = lang;
  const steps = (($('#mus-steps-in') || {}).value || '').trim();
  if (steps) body.steps = parseInt(steps, 10);

  const btn = $('#mus-go'), note = $('#mus-note'), prog = $('#mus-prog'), cancel = $('#mus-cancel');
  btn.disabled = true; cancel.hidden = false; prog.hidden = false;
  note.textContent = '生成中…（MLX 引擎，几 秒 到 几十 秒）';
  state.musAbort = new AbortController();
  const t0 = performance.now();
  try {
    const base = state.server && state.server !== location.origin ? state.server : '';
    const res = await fetch(base + '/v1/music/generate', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body), signal: state.musAbort.signal,
    });
    const txt = await res.text();
    let data; try { data = JSON.parse(txt); } catch (e) { data = { error: { message: txt } }; }
    if (!res.ok) throw new Error((data.error && data.error.message) || ('HTTP ' + res.status));
    const dt = ((performance.now() - t0) / 1000).toFixed(1);
    const item = (data.data || [])[0] || {};
    note.textContent = '完成 ✅ ' + dt + ' 秒（引擎：' + (data.engine || 'mlx') + '）'
      + (data.duration ? ' · 时长 ' + Math.round(data.duration) + ' 秒' : '')
      + (data.duration_reason ? '（' + data.duration_reason + '）' : '');
    state.musTracks.unshift({
      title: data.title || title || '未命名', url: item.url || '',
      sec: data.sec, engine: data.engine, duration: data.duration,
    });
    state.musTracks = state.musTracks.slice(0, 40);
    paintMusicTracks();
    // 新 出 的 那 首 -> 直接 摆 进 播放器 (不用 再 点 一下 播放)
    const pbox = $('#mus-player');
    if (pbox && item.url) {
      pbox.innerHTML = '<h3 style="margin:0">' + esc(data.title || title || '未命名') + '</h3>'
        + '<audio controls src="' + esc(item.url) + '"></audio>';
    }
    const ttl = $('#mus-title');
    if (ttl) ttl.textContent = data.title || title || '还没有音乐';
  } catch (e) {
    note.textContent = (e.name === 'AbortError') ? '已停止' : ('失败：' + e.message);
  } finally {
    btn.disabled = false; cancel.hidden = true; prog.hidden = true;
    state.musAbort = null;
  }
}

function paintMusicTracks() {
  const box = $('#mus-tracks');
  if (!box) return;
  const list = state.musTracks || [];
  if (!list.length) { box.innerHTML = '<div class="music-empty">还没有 成品</div>'; return; }
  box.innerHTML = list.map((t, i) => `
    <div class="music-track" data-i="${i}">
      <span class="mt-name" title="${esc(t.title)}">${esc(t.title)}</span>
      <span class="mt-meta">${t.sec != null ? t.sec + 's' : ''} · ${esc(t.engine || '')}</span>
      <button type="button" data-act="play">播放</button>
      <button type="button" data-act="save">下载</button>
    </div>`).join('');
  $$('#mus-tracks .music-track').forEach(row => {
    const t = list[parseInt(row.dataset.i, 10)];
    const b = row.querySelector('[data-act="play"]');
    if (b) b.onclick = () => {
      const p = $('#mus-player');
      if (p) p.innerHTML = `<h3 style="margin:0">${esc(t.title)}</h3>
        <audio controls autoplay src="${esc(t.url)}"></audio>`;
    };
    const s = row.querySelector('[data-act="save"]');
    if (s) s.onclick = () => {
      const a = document.createElement('a');
      a.href = t.url; a.download = (t.title || 'music') + '.mp3'; a.click();
    };
  });
}

function bindMusicSquare() {
  const btn = $('#mus-square-refresh');
  if (btn) btn.onclick = () => loadMusicSquare();
}

/* 广场 的 试听 播放器 —— 一 个 全局 <audio>, 同一 首 再 点 一下 就 暂停. */
let musSquareAudio = null;
function musSquarePlay(url, btn) {
  try {
    if (!musSquareAudio) musSquareAudio = new Audio();
    if (musSquareAudio.dataset.url === url && !musSquareAudio.paused) {
      musSquareAudio.pause();
      if (btn) btn.textContent = '试听';
      return;
    }
    $$('#mus-square-body [data-play]').forEach(b => { if (b !== btn) b.textContent = '试听'; });
    musSquareAudio.src = url;
    musSquareAudio.dataset.url = url;
    musSquareAudio.play().catch(e => toast('播放 失败：' + e.message));
    if (btn) btn.textContent = '⏸';
  } catch (e) {
    toast('播放 失败');
  }
}

async function loadMusicSquare() {
  const body = $('#mus-square-body'), hint = $('#mus-square-hint');
  if (!body) return;
  body.innerHTML = '<tr><td colspan="6" class="music-empty">加载中…</td></tr>';
  try {
    const r = await api('/v1/music/square?page_size=50');
    if (!r.ok) { body.innerHTML = `<tr><td colspan="6" class="music-empty">${esc(r.error || '加载 失败')}</td></tr>`; return; }
    const items = r.items || [];
    if (!items.length) { body.innerHTML = '<tr><td colspan="6" class="music-empty">没 内容</td></tr>'; }
    else {
      body.innerHTML = items.map(it => `
        <tr>
          <td class="t-title">${esc(it.title)}</td>
          <td class="t-tags">${esc(it.model || '')}</td>
          <td class="t-tags">${esc(it.tags || it.prompt || '')}</td>
          <td class="t-num">${esc(it.duration || '')}</td>
          <td class="t-num">${esc(it.ts || it.serial_no || '')}</td>
          <td>${it.url ? `<button type="button" class="chip" data-play="${esc(it.url)}">试听</button>` : ''}
            <button type="button" class="chip" data-prompt="${esc(it.prompt || it.tags || '')}"${it.model_id ? ` data-model="${esc(it.model_id)}"` : ''}>用这首</button></td>
        </tr>`).join('');
      $$('#mus-square-body [data-play]').forEach(b => b.onclick = () => musSquarePlay(b.dataset.play, b));
      $$('#mus-square-body [data-prompt]').forEach(b => b.onclick = () => {
        const ta = $('#mus-prompt-in');
        if (ta) { ta.value = b.dataset.prompt; ta.focus(); }
        // 选 中 同一 个 模型 (和 「模型」页 是 一 套 id) —— 复刻 才 是 同一 个 声音
        const mid = b.dataset.model;
        if (mid) {
          const sel = $('#mus-model-sel');
          const opt = sel && Array.from(sel.options).find(o => o.value === mid);
          if (opt) sel.value = mid;
          else toast('这个 模型 不 在 列表 里 —— 先 去 「模型」页 加');
        }
        state.musTab = 'create'; renderMusic();
        toast('已 填 进 提示词');
      });
    }
    if (hint) hint.textContent = (r.total || items.length) + ' 首 · 我们 的 模型 出 的';
  } catch (e) {
    body.innerHTML = `<tr><td colspan="6" class="music-empty">${esc(e.message)}</td></tr>`;
  }
}

function bindMusicWorks() {
  const btn = $('#mus-works-refresh');
  if (btn) btn.onclick = () => loadMusicWorks();
}

async function loadMusicWorks() {
  const body = $('#mus-works-body'), hint = $('#mus-works-hint');
  if (!body) return;
  body.innerHTML = '<tr><td colspan="5" class="music-empty">扫描中…</td></tr>';
  try {
    const r = await api('/v1/music/works');
    const rows = r.local || [];
    if (!rows.length) body.innerHTML = '<tr><td colspan="5" class="music-empty">没 找到 本地 成品</td></tr>';
    else {
      body.innerHTML = rows.map(it => `
        <tr>
          <td class="t-title">${esc(it.name)}</td>
          <td class="t-tags">${esc(it.src)}</td>
          <td class="t-num">${(it.size / 1048576).toFixed(1)} MB</td>
          <td class="t-num">${esc(it.ts)}</td>
          <td><button type="button" class="chip" data-path="${esc(it.path)}">在访达中显示</button></td>
        </tr>`).join('');
      $$('#mus-works-body [data-path]').forEach(b => b.onclick = () => {
        api('/v1/music/reveal', { method: 'POST', body: { path: b.dataset.path } })
          .then(() => toast('已 在 访达 中 定位'))
          .catch(e => toast('失败：' + e.message));
      });
    }
    if (hint) hint.textContent = (r.local_count || 0) + ' 个 本地 成品' +
      (r.online_count ? ' · ' + r.online_count + ' 个 在线 作品' : '');
  } catch (e) {
    body.innerHTML = `<tr><td colspan="5" class="music-empty">${esc(e.message)}</td></tr>`;
  }
}

function bindMusicBatch() {
  const sample = $('#mus-batch-sample');
  if (sample) sample.onclick = () => {
    const ta = $('#mus-batch-json');
    if (ta) ta.value = JSON.stringify([
      { title: '夜航', lyrics: '[Verse]\n夜色沉进车窗\n灯光一盏盏后退\n\n[Chorus]\n我们在路上飞', tags: '流行, 抒情', duration: 60 },
      { title: 'City Light', description: '轻快的 city pop，日语女声，合成器和电吉他', tags: 'city pop, 欢快', duration: 60 },
      { title: '江南雨', lyrics: '[Intro]\n笛声穿过青瓦\n[Verse]\n雨落进了烟雨小桥', tags: '古风, 唯美', instrumental: true, duration: 60 },
    ], null, 1);
  };
  const go = $('#mus-batch-go');
  if (go) go.onclick = () => musicBatchStart();
  const stop = $('#mus-batch-stop');
  if (stop) stop.onclick = () => musicBatchStop();
}

async function musicBatchStart() {
  const ta = $('#mus-batch-json');
  let items;
  try { items = JSON.parse((ta && ta.value) || '[]'); }
  catch (e) { toast('清单 有 误：' + e.message); return; }
  if (!Array.isArray(items) || !items.length) { toast('清单 是 空 的'); return; }
  const conc = Number((($('#mus-batch-conc') || {}).value) || 2);
  const log = $('#mus-batch-log'), prog = $('#mus-batch-prog');
  const go = $('#mus-batch-go'), stop = $('#mus-batch-stop'), hint = $('#mus-batch-hint');
  go.disabled = true; stop.hidden = false; prog.hidden = false;
  if (log) log.textContent = '开始…';
  try {
    const r = await api('/v1/music/batch', { method: 'POST', body: { items, concurrency: conc } });
    if (!r.ok) throw new Error(r.error || '提交 失败');
    state.musBatchJob = r.job_id;
    if (hint) hint.textContent = '批次 ' + r.job_id + ' · 共 ' + r.total + ' 首';
    musicBatchPoll();
  } catch (e) {
    if (log) log.textContent = '失败：' + e.message;
    go.disabled = false; stop.hidden = true; prog.hidden = true;
  }
}

function musicBatchPoll() {
  if (!state.musBatchJob) return;
  api('/v1/music/batch?id=' + encodeURIComponent(state.musBatchJob)).then(r => {
    const log = $('#mus-batch-log'), prog = $('#mus-batch-prog');
    const go = $('#mus-batch-go'), stop = $('#mus-batch-stop');
    if (log) log.textContent = (r.log || []).join('\n');
    if (prog) {
      const pct = r.total ? Math.round((r.done / r.total) * 100) : 0;
      prog.querySelector('span').style.width = pct + '%';
    }
    if (r.status === 'running') { setTimeout(musicBatchPoll, 1200); return; }
    state.musBatchJob = null;
    if (go) go.disabled = false;
    if (stop) stop.hidden = true;
    if (prog) prog.hidden = true;
    if (log) log.textContent += '\n—— 结束 (' + r.done + '/' + r.total + ') ——';
    if (r.out_dir) toast('产出 目录：' + r.out_dir);
  }).catch(() => {
    state.musBatchJob = null;
    const go = $('#mus-batch-go'), stop = $('#mus-batch-stop'), prog = $('#mus-batch-prog');
    if (go) go.disabled = false;
    if (stop) stop.hidden = true;
    if (prog) prog.hidden = true;
  });
}

function musicBatchStop() {
  state.musBatchJob = null;
  const go = $('#mus-batch-go'), stop = $('#mus-batch-stop'), prog = $('#mus-batch-prog');
  if (go) go.disabled = false;
  if (stop) stop.hidden = true;
  if (prog) prog.hidden = true;
  const log = $('#mus-batch-log');
  if (log) log.textContent += '\n—— 已 停止 等待 (引擎 那边 可能 还 在 跑) ——';
}

boot();
</script>
</body>
</html>
