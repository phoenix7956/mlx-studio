<!doctype html>
<html lang="zh-CN" data-theme="light" data-accent="blue" data-textsize="default">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MLX Serve Studio</title>
<style>
:root{
  --sidebar-width:220px;
  --topbar-h:44px;
  --bg:#ffffff; --bg-2:#f9f9f9; --bg-3:#f1f1f1;
  --text:#262626; --text-2:#707070; --sep:#e8e8e8;
  --accent:#007aff; --ok:#30b94a; --pending:#bd7100; --error:#c52d29;
  --radius:10px;
  --fs-body:0.8125rem; --fs-title:1.625rem; --fs-section:0.9375rem;
  --fs-anno:0.6875rem; --fs-chat:0.875rem;
}
html[data-theme="dark"]{
  --bg:#1f1f21; --bg-2:#252528; --bg-3:#2c2c2e;
  --text:#e5e5e5; --text-2:#9a9a9a; --sep:#3a3a3c;
  --accent:#0a84ff; --ok:#30b94a; --pending:#bd7100; --error:#ff453a;
}
html[data-accent="purple"]{--accent:#8944e0}
html[data-accent="pink"]{--accent:#d6337c}
html[data-accent="red"]{--accent:#e03131}
html[data-accent="orange"]{--accent:#f76707}
html[data-accent="yellow"]{--accent:#f59f00}
html[data-accent="green"]{--accent:#2f9e44}
html[data-accent="graphite"]{--accent:#5c5c5c}
html[data-textsize="small"]{--fs-body:0.75rem;--fs-chat:0.8125rem;--fs-title:1.375rem}
html[data-textsize="large"]{--fs-body:0.875rem;--fs-chat:0.9375rem;--fs-title:1.75rem}
html[data-textsize="xlarge"]{--fs-body:0.9375rem;--fs-chat:1rem;--fs-title:2rem}

*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;background:var(--bg-3);color:var(--text);
  font-family:system-ui,-apple-system,"PingFang SC","Helvetica Neue",sans-serif;
  font-size:var(--fs-body);line-height:1.5;
}
button,input,textarea,select{font:inherit;color:inherit}
a{color:var(--accent)}
#app{display:grid;grid-template-columns:var(--sidebar-width) minmax(0,1fr);
  grid-template-rows:100vh;height:100vh;overflow:hidden}

/* ---------- 侧栏 ---------- */
.sidebar{
  background:var(--bg-2);border-right:1px solid var(--sep);
  display:flex;flex-direction:column;overflow-y:auto;min-height:0;
  position:sticky;top:0;height:100vh;
}
.side-top{display:flex;justify-content:flex-end;padding:10px 10px 2px}
.side-toggle{
  width:28px;height:28px;border-radius:8px;border:1px solid var(--sep);background:var(--bg);
  color:var(--text-2);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;
}
.side-toggle:hover{background:var(--bg-3);color:var(--text)}
#app.collapsed{grid-template-columns:0 minmax(0,1fr)}
#app.collapsed .sidebar{display:none}
.brand{padding:16px 16px 10px;display:flex;align-items:baseline;gap:8px}
.brand small{color:var(--text-2);font-size:var(--fs-anno)}
.nav{padding:6px 8px 16px;display:flex;flex-direction:column;gap:2px}
.nav .group{
  font-size:var(--fs-anno);color:var(--text-2);text-transform:uppercase;
  letter-spacing:.06em;padding:12px 10px 4px;
}
.nav button{
  display:flex;align-items:center;gap:9px;width:100%;text-align:left;
  padding:7px 10px;border:0;border-radius:8px;background:transparent;
  color:var(--text);cursor:pointer;
}
.nav button:hover{background:var(--bg-3)}
.nav button.active{background:var(--bg-3);color:var(--accent);font-weight:600}
.nav button .ic{width:17px;height:17px;flex:none;display:inline-flex;align-items:center;justify-content:center;opacity:.85}
.ic-svg{display:inline-block;vertical-align:-2px}
.side-foot{
  margin-top:auto;padding:10px 12px 14px;font-size:var(--fs-anno);color:var(--text-2);
  display:flex;flex-direction:column;gap:6px;
}
.srv-box{
  background:var(--bg-3);border-radius:8px;padding:7px 10px;display:flex;align-items:center;
  justify-content:center;gap:7px;font-weight:600;color:var(--text);font-size:var(--fs-body);
}
.srv-stats{line-height:1.5;color:var(--text-2)}
.srv-addr{color:var(--text-2)}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--text-2);margin-right:6px;vertical-align:middle}
.dot.ok{background:var(--ok)} .dot.pending{background:var(--pending)} .dot.err{background:var(--error)}

/* ---------- 主区 ---------- */
.content{display:flex;flex-direction:column;min-width:0;min-height:0;height:100vh;overflow:hidden;background:var(--bg)}
.topbar{
  height:var(--topbar-h);flex:0 0 var(--topbar-h);display:flex;align-items:center;
  gap:12px;padding:0 16px;background:var(--bg);
}
.topbar h1{font-size:var(--fs-section);font-weight:600;margin:0}
.topbar .spacer{flex:1}
.topbar .chip{
  display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;
  background:var(--bg-3);font-size:var(--fs-anno);color:var(--text-2);
}
.iconbtn{
  width:30px;height:30px;border-radius:8px;border:1px solid transparent;background:transparent;
  cursor:pointer;display:inline-flex;align-items:center;justify-content:center;font-size:1rem;
}
.iconbtn:hover{background:var(--bg-3)}
.iconbtn.round{width:28px;height:28px;border-radius:50%;background:var(--bg-3);color:var(--text-2)}
.iconbtn.round.on{background:var(--bg-2);color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.pages{flex:1;min-height:0;overflow-y:auto;padding:20px 22px 40px}
.page{display:none;max-width:1180px;margin:0 auto}
.page.active{display:block}
/* 媒体 工作区 (图像 / 视频 / 音频): 满高, 顶栏 不显示 标题 —— 照 闭源 */
body.ws-media .pages{padding:0;overflow:hidden}
body.ws-media .page.active{height:100%;max-width:none;margin:0}
body.ws-media .topbar h1{visibility:hidden}
body.ws-media #page-library{max-width:1280px;margin:0 auto;padding:20px 22px 40px}
.page-title{font-size:var(--fs-title);font-weight:700;margin:0 0 4px;letter-spacing:-.4px}
.page-sub{color:var(--text-2);margin:0 0 18px;font-size:var(--fs-body)}

/* ---------- 卡片 / 面板 ---------- */
.card{background:var(--bg);border:1px solid var(--sep);border-radius:var(--radius);padding:14px 16px}
.grid{display:grid;gap:12px}
.grid.c4{grid-template-columns:repeat(4,minmax(0,1fr))}
.grid.c2{grid-template-columns:repeat(2,minmax(0,1fr))}
.grid.c3{grid-template-columns:repeat(3,minmax(0,1fr))}
.metric .label{font-size:var(--fs-anno);color:var(--text-2);text-transform:uppercase;letter-spacing:.05em}
.metric .value{font-size:1.5rem;font-weight:650;margin-top:4px;font-variant-numeric:tabular-nums}
.metric .note{font-size:var(--fs-anno);color:var(--text-2);margin-top:2px}
.section-title{font-size:var(--fs-section);font-weight:600;margin:22px 0 10px}

/* ---------- 对话 ---------- */
.chat-wrap{display:flex;flex-direction:column;height:100%}
.chat-scroll{flex:1;overflow-y:auto;padding:5px 0 8px}
.welcome{max-width:976px;margin:0 auto 0;text-align:center}

.welcome h2{font-size:1.7rem;line-height:1.25;margin:195px 0 18px;font-weight:700;letter-spacing:0}
.welcome p{display:none}
.chips{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.chip-btn{
  display:inline-flex;align-items:center;gap:7px;
  border:1px solid var(--sep);background:var(--bg);border-radius:999px;
  padding:6px 13px;cursor:pointer;color:var(--text);font-size:var(--fs-body);
}
.chip-btn:hover{border-color:var(--accent);color:var(--accent)}
.chip-btn .ic-svg{color:var(--text-2)}
.chip-btn[data-act="media"] .ic-svg{color:#d6337c}
.chip-btn[data-act="models"] .ic-svg{color:var(--accent)}
.chip-btn[data-act="launcher"] .ic-svg{color:var(--ok)}
.msgs{max-width:976px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.msg{display:flex;gap:12px}
.msg .who{
  flex:0 0 30px;height:30px;border-radius:8px;display:flex;align-items:center;justify-content:center;
  background:var(--bg-3);font-size:var(--fs-anno);color:var(--text-2);
}
.msg.user .who{background:var(--accent);color:#fff}
.bubble{
  background:var(--bg);border:1px solid var(--sep);border-radius:var(--radius);
  padding:10px 13px;white-space:pre-wrap;word-break:break-word;font-size:var(--fs-chat);max-width:100%;
}
.msg.user .bubble{background:var(--bg-3);border-color:transparent}
.bubble.warn{color:var(--pending);border-color:rgba(189,113,0,.35);background:rgba(189,113,0,.06)}
.think{
  margin-bottom:8px;border-left:2px solid var(--sep);padding:4px 0 4px 10px;
  color:var(--text-2);font-size:var(--fs-anno);white-space:pre-wrap;max-height:190px;overflow:auto;
}
.think b{color:var(--text-2);font-weight:600}
.msg-foot{display:flex;gap:10px;margin-top:6px;font-size:var(--fs-anno);color:var(--text-2)}
.msg-foot button{border:0;background:none;color:var(--text-2);cursor:pointer;padding:0;font-size:var(--fs-anno)}
.msg-foot button:hover{color:var(--accent)}
.composer-wrap{padding:12px 0 18px}
.composer-note{color:var(--text-2);font-size:var(--fs-anno);text-align:center;margin:8px 0 0}
.disc-menu{position:relative;display:inline-block}
.disc-menu>summary{list-style:none;cursor:pointer}
.disc-menu>summary::-webkit-details-marker{display:none}
.disc-menu[open]>summary{background:var(--bg-3)}
.discovery-menu{position:absolute;top:calc(100% + 6px);left:50%;transform:translateX(-50%);z-index:40;
  background:var(--bg);border:1px solid var(--sep);border-radius:8px;box-shadow:0 8px 24px rgba(0,0,0,.16);
  padding:4px;min-width:170px;display:flex;flex-direction:column}
.discovery-menu button{background:0 0;border:0;text-align:left;padding:6px 10px;border-radius:6px;
  cursor:pointer;font-size:var(--fs-body);color:var(--text);white-space:nowrap}
.discovery-menu button:hover{background:var(--bg-3)}
.composer{max-width:976px;margin:0 auto;background:var(--bg);border:1px solid var(--sep);border-radius:16px;padding:8px}
.composer textarea{
  display:block;width:100%;border:0;outline:0;resize:none;background:transparent;padding:0;
  height:43px;min-height:43px;max-height:220px;font-size:var(--fs-chat);
}
.composer-bar{display:flex;align-items:center;gap:6px;margin-top:0}
.composer-bar .iconbtn.round{width:36px;height:36px}
.composer-bar .model-picker{height:30px;border-radius:10px}
.ctx-btn{
  width:24px;height:24px;min-width:24px;padding:0;border-radius:50%;
  border:2px solid var(--text-2);background:transparent;cursor:pointer;
  position:relative;flex-shrink:0;
}
.ctx-btn:hover{border-color:var(--text)}
.ctx-pop{
  position:absolute;bottom:32px;left:-8px;z-index:60;min-width:230px;
  background:var(--bg);border:1px solid var(--sep);border-radius:10px;padding:12px 14px;
  box-shadow:0 12px 32px rgba(0,0,0,.14);text-align:left;
}
.ctx-stats{display:grid;grid-template-columns:1fr 1fr;gap:10px 14px;font-size:var(--fs-anno)}
.ctx-stats dt{color:var(--text-2)}
.ctx-stats dd{text-align:right;margin:0;font-variant-numeric:tabular-nums}
.ctx-pop h4{margin:0 0 8px;font-size:var(--fs-body)}
.composer-bar .send{width:36px;height:36px}
.composer-bar .spacer{flex:1}
.model-picker{
  display:inline-flex;align-items:center;gap:6px;border:1px solid var(--sep);background:var(--bg-2);
  border-radius:999px;padding:4px 10px;cursor:pointer;font-size:var(--fs-anno);
}
.send{
  width:36px;height:36px;border-radius:50%;border:0;background:var(--accent);color:#fff;
  display:inline-flex;align-items:center;justify-content:center;cursor:pointer;font-size:1rem;
}
.send:disabled{opacity:.4;cursor:not-allowed}
.toggle{
  display:inline-flex;align-items:center;gap:6px;border:1px solid var(--sep);background:var(--bg-2);
  border-radius:999px;padding:4px 10px;cursor:pointer;font-size:var(--fs-anno);color:var(--text-2);
}
.toggle.on{color:var(--accent);border-color:var(--accent)}
select,input[type=text],input[type=number],textarea.field{
  background:var(--bg-2);border:1px solid var(--sep);border-radius:8px;padding:7px 10px;outline:0;width:100%;
}
label.fld{display:block;margin-bottom:10px}
label.fld span{display:block;font-size:var(--fs-anno);color:var(--text-2);margin-bottom:4px}
.row{display:flex;gap:12px;flex-wrap:wrap}
.row>*{flex:1;min-width:180px}
.row-tight>*{flex:none;min-width:0}
.row-tight .hint{margin-left:10px}
button.primary{
  background:var(--accent);color:#fff;border:0;border-radius:8px;padding:8px 16px;cursor:pointer;font-weight:600;
}
button.primary:disabled{opacity:.45;cursor:not-allowed}
button.primary.is-empty{opacity:.45}
button.ghost{
  background:var(--bg-2);border:1px solid var(--sep);border-radius:8px;padding:8px 14px;cursor:pointer;
}
button.ghost:hover{border-color:var(--accent);color:var(--accent)}
table{width:100%;border-collapse:collapse;font-size:var(--fs-body)}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--sep)}
th{color:var(--text-2);font-weight:600;font-size:var(--fs-anno);text-transform:uppercase;letter-spacing:.04em}
.badge{display:inline-block;padding:2px 8px;border-radius:999px;font-size:var(--fs-anno);background:var(--bg-3);color:var(--text-2)}
.badge.loaded{background:rgba(48,185,74,.15);color:var(--ok)}
.badge.absent{background:rgba(197,45,41,.12);color:var(--error)}
.badge.ready{background:rgba(189,113,0,.13);color:var(--pending)}
.badge.free{background:rgba(48,185,74,.15);color:var(--ok)}
.badge.cond{background:rgba(189,113,0,.15);color:var(--pending)}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:var(--fs-anno)}
canvas.spark{width:100%;height:56px;display:block}
.media-item{border:1px solid var(--sep);border-radius:var(--radius);overflow:hidden;background:var(--bg)}
.media-item img,.media-item video{width:100%;display:block;background:#000}
.media-item .cap{padding:7px 10px;font-size:var(--fs-anno);color:var(--text-2)}
.media-item .dl3d{color:var(--accent);text-decoration:none;margin-left:8px}

/* --- 闭源 Studio 骨架 对齐: 跳至内容 / 此服务器 卡片 / 会话 列表 / 代码启动器 --- */
.skip{position:absolute;left:-9999px;top:0;background:var(--accent);color:#fff;padding:8px 14px;z-index:99;border-radius:0 0 8px 0}
.skip:focus{left:0}
.brand{cursor:pointer}
.srv-card{
  border:1px solid var(--sep);border-radius:var(--radius);background:var(--bg-2);
  padding:12px 14px;margin:0 auto 22px;max-width:560px;text-align:left;
}
.srv-h{font-size:var(--fs-anno);color:var(--text-2);margin-bottom:4px}
.srv-l{font-size:var(--fs-body);font-weight:600}
.srv-a{color:var(--text-2);margin-top:3px}
.newchat{
  display:flex;align-items:center;gap:8px;width:100%;text-align:left;background:transparent;
  border:1px solid var(--sep);border-radius:8px;padding:7px 10px;cursor:pointer;color:var(--text);
}
.newchat:hover{border-color:var(--accent);color:var(--accent)}
#sess-list{margin-top:6px;max-height:17vh;overflow:auto}
.sess{
  display:flex;align-items:center;gap:6px;width:100%;background:transparent;border:0;
  border-radius:8px;padding:6px 10px;cursor:pointer;color:var(--text-2);text-align:left;font-size:var(--fs-anno);
}
.sess:hover{background:var(--bg-2);color:var(--text)}
.sess.active{background:var(--bg-3);color:var(--text)}
.sess-t{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sess-x{opacity:.55}
.sess-i{display:inline-flex;align-items:center;justify-content:center;opacity:.7;flex:none}
.card{margin-bottom:14px}
.card-h{font-weight:600;margin-bottom:8px}
.kv{display:flex;gap:10px;align-items:baseline;padding:5px 0;border-bottom:1px solid var(--sep);font-size:var(--fs-anno)}
.kv span:first-child{color:var(--text-2);width:92px;flex:none}
.kv code{word-break:break-all}
.seg{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.seg button{background:var(--bg-2);border:1px solid var(--sep);border-radius:999px;padding:5px 12px;cursor:pointer;color:var(--text)}
.seg button.on{border-color:var(--accent);color:var(--accent)}
.cmd{
  background:var(--bg-2);border:1px solid var(--sep);border-radius:8px;padding:12px;
  white-space:pre-wrap;word-break:break-all;font-size:var(--fs-anno);line-height:1.6;margin:0 0 10px;
}
.hint{color:var(--text-2);font-size:var(--fs-anno);flex:1;min-width:0}
.small{font-size:var(--fs-anno)}
.ep{display:flex;gap:10px;align-items:baseline;padding:4px 0;border-bottom:1px solid var(--sep);font-size:var(--fs-anno)}
.ep span{color:var(--text-2)}
.ep .ep-st{margin-left:auto}

.toast{
  position:fixed;right:18px;bottom:18px;background:var(--text);color:var(--bg);
  padding:9px 14px;border-radius:8px;font-size:var(--fs-anno);opacity:0;transition:opacity .2s;pointer-events:none;
}
.toast.show{opacity:.95}
.spacer8{height:8px}
/* ---------- 参数 面板 (照 闭源 Studio 的 媒体 参数 组) ---------- */
.panel{background:var(--bg);border:1px solid var(--sep);border-radius:var(--radius);padding:12px 14px;margin-bottom:12px}
.panel>h3{font-size:var(--fs-anno);color:var(--text-2);text-transform:uppercase;letter-spacing:.05em;margin:0 0 10px;font-weight:600}
.fgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:10px 12px}
.fgrid>label.fld{margin:0}
.fld>span{display:block;font-size:var(--fs-anno);color:var(--text-2);margin-bottom:4px}
.fld .hint{font-size:var(--fs-anno);color:var(--text-2);margin-top:3px;display:block}
.seg{display:inline-flex;border:1px solid var(--sep);border-radius:8px;overflow:hidden}
.seg button{border:0;background:var(--bg-2);padding:5px 11px;cursor:pointer;font-size:var(--fs-anno);color:var(--text-2)}
.seg button.on{background:var(--accent);color:#fff}
.chipset{display:flex;flex-wrap:wrap;gap:6px}
.chipset button{border:1px solid var(--sep);background:var(--bg-2);border-radius:999px;padding:4px 10px;font-size:var(--fs-anno);cursor:pointer;color:var(--text-2)}
.chipset button.on{border-color:var(--accent);color:var(--accent)}
.drop{border:1px dashed var(--sep);border-radius:8px;padding:9px;text-align:center;color:var(--text-2);font-size:var(--fs-anno);cursor:pointer}
.drop:hover,.drop.on{border-color:var(--accent);color:var(--accent)}
.toolcard{border:1px solid var(--sep);border-radius:8px;padding:8px 10px;margin-top:8px;background:var(--bg-2);font-size:var(--fs-anno)}
.toolcard b{color:var(--accent)}
.libbar{display:flex;gap:8px;align-items:center;margin-bottom:12px;flex-wrap:wrap}
.libbar input[type=text]{max-width:280px}
/* ---------- 媒体 页 两 栏 (照 闭源: 左 参数, 右 产物) ---------- */
.media2{display:grid;grid-template-columns:minmax(0,470px) minmax(0,1fr);gap:26px;align-items:start}
.media2-form{min-width:0}
.media2-out{min-width:0}
@media (max-width:1100px){.media2{grid-template-columns:1fr}}
/* ---------- 子 标签 条 + 搜索 条 (照 闭源 的 「我的模型」 / 「筛选模型…」) ---------- */
.subbar{display:flex;align-items:center;gap:8px;margin:0 0 16px;padding-bottom:12px;border-bottom:1px solid var(--sep)}
.subbar .tab{display:inline-flex;align-items:center;gap:6px;background:var(--accent);color:#fff;border-radius:999px;padding:5px 12px;font-size:var(--fs-anno);font-weight:600}
.subbar .spacer{flex:1}
.searchbar{display:flex;align-items:center;gap:8px;background:var(--bg-2);border:1px solid var(--sep);border-radius:8px;padding:7px 11px;margin-bottom:12px;color:var(--text-2)}
.searchbar input{flex:1;border:0;outline:0;background:transparent;font-size:var(--fs-body)}
/* ---------- 设置 页: 左 分类, 右 内容 (照 闭源) ---------- */
.settings2{display:grid;grid-template-columns:190px minmax(0,1fr);gap:22px;align-items:start}
.set-cats{display:flex;flex-direction:column;gap:2px;position:sticky;top:0}
.set-cats button{
  display:flex;align-items:center;gap:8px;text-align:left;background:transparent;border:0;
  border-radius:8px;padding:8px 10px;cursor:pointer;color:var(--text);font-size:var(--fs-body);
}
.set-cats button:hover{background:var(--bg-3)}
.set-cats button.on{background:var(--bg-3);font-weight:600}
.set-main{min-width:0;background:var(--bg);border:1px solid var(--sep);border-radius:var(--radius);overflow:hidden}
.set-search{display:flex;align-items:center;gap:8px;padding:12px 16px;border-bottom:1px solid var(--sep);color:var(--text-2)}
.set-search input{flex:1;border:0;outline:0;background:transparent;font-size:var(--fs-body)}
.set-scroll{padding:4px 16px 16px;max-height:calc(100vh - 150px);overflow:auto}
.set-sec h3{font-size:var(--fs-section);font-weight:700;margin:16px 0 6px}
.set-row{display:flex;align-items:center;gap:20px;padding:13px 0;border-bottom:1px solid var(--sep)}
.set-lab{flex:1;min-width:0}
.set-lab b{display:block;font-weight:600;font-size:var(--fs-body)}
.set-lab span{display:block;color:var(--text-2);font-size:var(--fs-anno);margin-top:2px}
.set-ctl{flex:0 0 auto;min-width:150px;display:flex;justify-content:flex-end}
.set-ctl select{min-width:130px}
.set-ctl input[type=text],.set-ctl input[type=number]{min-width:170px}
.switch{position:relative;display:inline-block;width:38px;height:22px;cursor:pointer}
.switch input{position:absolute;opacity:0;width:100%;height:100%;margin:0;cursor:pointer}
.switch span{position:absolute;inset:0;background:var(--bg-3);border-radius:999px;transition:background .15s}
.switch span::after{content:"";position:absolute;top:2px;left:2px;width:18px;height:18px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .15s}
.switch input:checked + span{background:var(--accent)}
.switch input:checked + span::after{transform:translateX(16px)}
@media (max-width:900px){.settings2{grid-template-columns:1fr}}
.media-item img,.media-item video{width:100%;border-radius:8px;display:block;background:var(--bg-3)}
.media-item audio{width:100%;margin-top:6px}
.swatches{display:flex;gap:8px;flex-wrap:wrap}
.swatch{width:24px;height:24px;border-radius:50%;border:2px solid transparent;cursor:pointer}
.swatch.on{border-color:var(--text)}
.radio{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.eq{display:inline-flex;gap:2px;align-items:flex-end;height:14px}
.eq i{width:3px;background:var(--accent);height:4px;display:block;border-radius:1px}
.krow{display:flex;gap:8px;align-items:center}
.krow input{flex:1}
.listbox{border:1px solid var(--sep);border-radius:8px;overflow:hidden}
.listbox>div{display:flex;justify-content:space-between;gap:10px;padding:8px 10px;border-bottom:1px solid var(--sep);font-size:var(--fs-anno)}
.listbox>div:last-child{border-bottom:0}
html[data-compact="1"] .page-sub{margin-bottom:10px}
html[data-compact="1"] .card,html[data-compact="1"] .panel{padding:9px 11px}
html[data-compact="1"] .section-title{margin:14px 0 7px}
.msgs{max-width:var(--chatcol,820px)}
.composer{max-width:var(--chatcol,940px)}
@media (max-width:900px){
  #app{grid-template-columns:1fr}
  .sidebar{position:fixed;inset:0 auto 0 0;width:var(--sidebar-width);z-index:20;transform:translateX(-100%);transition:transform .18s}
  .sidebar.open{transform:none}
  .grid.c4{grid-template-columns:repeat(2,minmax(0,1fr))}
  .grid.c3,.grid.c2{grid-template-columns:1fr}
}
@media (min-width:901px){
  #menu-btn{display:none}
}

/* ============================================================ 媒体 页 (照 闭源 Studio: 左 参数 + 右 输出) */
.pages.media-mode{padding:0;overflow:hidden}
.pages.media-mode>.page{max-width:none;margin:0;padding:0;height:100%}
.image-screen{display:grid;grid-template-columns:minmax(340px,1fr) minmax(280px,1fr);height:100%;min-height:0}
.image-controls{border-right:1px solid var(--sep);padding:16px;overflow-y:auto;min-width:0}
.image-controls fieldset{border:0;margin:0;padding:0;display:flex;flex-direction:column;gap:14px;min-width:0}
.image-section{display:flex;flex-direction:column;gap:6px;min-width:0}
.image-section h2,.image-section h3,.image-heading>label{margin:0;font-size:var(--fs-body);font-weight:600}
.image-controls label{flex-direction:column;gap:4px;font-size:.75rem;display:flex}
.image-controls .check-label{flex-direction:row;align-items:center;gap:6px}
.image-controls input:not([type=checkbox]),.image-controls select,.image-controls textarea{max-width:100%;min-width:0}
.image-heading{display:flex;align-items:center;gap:6px;min-width:0}
.image-heading>label:first-child{margin-right:auto}
.image-model-card{background:color-mix(in srgb,var(--text) 4%,transparent);border:1px solid var(--sep);border-radius:8px;padding:10px;display:grid;grid-template-columns:auto minmax(0,1fr);align-items:center;gap:2px}
.image-model-card strong{font-size:var(--fs-body);overflow-wrap:anywhere}
.image-model-card .field-note{grid-column:1/-1}
.img-compare{border:1px solid var(--sep);border-radius:8px;overflow:hidden}
.img-compare table{width:100%;border-collapse:collapse;font-size:.75rem}
.img-compare th,.img-compare td{padding:6px 8px;text-align:left;border-bottom:1px solid var(--sep);white-space:nowrap}
.img-compare th{font-weight:600;color:var(--text-2);font-size:.6875rem;text-transform:uppercase;letter-spacing:.02em}
.img-compare tbody tr:last-child td{border-bottom:0}
.img-compare tbody tr.on{background:color-mix(in srgb,var(--accent) 10%,transparent)}
.img-compare tbody tr.on td:first-child{box-shadow:inset 2px 0 0 var(--accent)}
.img-compare td.num{font-variant-numeric:tabular-nums}
.img-compare .lic{white-space:normal}
.media-model-actions{display:flex;flex-wrap:wrap;align-items:center;gap:8px;justify-content:space-between}
.media-model-actions>.field-note{display:inline-flex;align-items:center;gap:5px}
.media-model-actions .dot{width:6px;height:6px;border-radius:50%;background:var(--text-2);display:inline-block;flex:none}
.media-model-actions .dot.on{background:var(--ok,#7fd18a)}
.media-model-actions .model-btns{display:inline-flex;align-items:center;gap:8px}
.media-model-actions button.chip.danger{color:var(--danger,#e5484d)}
.media-model-actions button.chip.danger:hover{border-color:var(--danger,#e5484d)}
.row-actions{display:flex;gap:6px;justify-content:flex-end}
button.ghost.danger{color:var(--error);border-color:transparent}
button.ghost.danger:hover{border-color:var(--error);color:var(--error)}
/* ---------- 确认 对话框 (删 模型 这种 不可逆 的 操作) ---------- */
.modal-scrim{position:fixed;inset:0;z-index:120;background:rgba(0,0,0,.28);
  display:flex;align-items:center;justify-content:center;padding:24px}
.modal{background:var(--bg);border:1px solid var(--sep);border-radius:var(--radius);
  box-shadow:0 18px 48px rgba(0,0,0,.24);padding:18px 20px;max-width:460px;width:100%}
.modal h3{margin:0 0 8px;font-size:var(--fs-title,1.05rem)}
.modal p{margin:0 0 14px;color:var(--text-2);font-size:var(--fs-body);line-height:1.55}
.modal p code{background:var(--bg-3);border-radius:5px;padding:1px 5px;font-size:.92em;overflow-wrap:anywhere}
.modal-actions{display:flex;justify-content:flex-end;gap:8px}
.modal-actions .primary.danger{background:var(--error);border-color:var(--error);color:#fff}
.image-menu>button{display:inline-flex;align-items:center;gap:5px}
.field-note{color:var(--text-2);font-size:var(--fs-anno)}
.field-note:empty{display:none}
.image-controls textarea{width:100%;height:110px;min-height:110px;resize:vertical;font:inherit;border-radius:6px;padding:8px}
.image-controls hr{border:0;border-top:1px solid var(--sep);width:100%;margin:0}
.image-drop-well{background:color-mix(in srgb,var(--text) 5%,transparent);border:1px solid transparent;border-radius:8px;padding:8px 12px}
.drag-over .image-drop-well{border-color:var(--accent)}
.image-well-action{color:var(--accent);background:0 0;border:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;width:100%;padding:4px 0;cursor:pointer}
.image-well-action>svg{width:24px;height:24px;color:var(--text-2)}
.image-well-action small{color:var(--text-2);margin-top:3px;font-size:var(--fs-anno);display:block}
.well-label{font-size:.75rem;font-weight:600;display:flex;align-items:center;gap:5px;margin-bottom:6px}
.well-btn{display:inline-flex;align-items:center;gap:6px;background:var(--bg);border:1px solid var(--sep);
  border-radius:7px;padding:5px 11px;font-size:var(--fs-anno);color:var(--text);cursor:pointer;margin:0 auto}
.well-btn:hover{border-color:var(--accent);color:var(--accent)}
.image-drop-well .field-note{text-align:center;margin:6px 0 0}
.segmented{display:inline-flex;background:color-mix(in srgb,var(--text) 8%,transparent);border:1px solid var(--sep);border-radius:7px;padding:2px;flex-shrink:0}
.segmented button{background:0 0;border:0;padding:4px 11px;font-size:.75rem;border-radius:6px;color:var(--text);cursor:pointer}
.segmented button[aria-pressed=true]{background:var(--bg);box-shadow:0 1px 3px rgba(0,0,0,.14)}
.image-controls .segmented{border:0;padding:2px;background:var(--bg-3)}
.audio-tabs{border:0;padding:0;background:transparent}
.image-controls .segmented button[aria-pressed=true],.audio-tabs button[aria-pressed=true]{background:var(--accent);color:#fff}
.chip{display:inline-flex;align-items:center;gap:5px;background:color-mix(in srgb,var(--text) 8%,transparent);border:0;border-radius:6px;padding:4px 9px;font-size:var(--fs-anno);color:var(--text);cursor:pointer}
.chip:hover{background:var(--bg-3)}
.chip:disabled{opacity:.45;cursor:not-allowed}
.image-menu{position:relative;display:inline-flex}
.image-menu-popup{position:absolute;z-index:40;top:100%;left:0;margin-top:4px;min-width:180px;max-width:320px;background:var(--bg);border:1px solid var(--sep);border-radius:8px;box-shadow:0 8px 24px rgba(0,0,0,.16);padding:5px;display:flex;flex-direction:column;max-height:320px;overflow:auto}
.image-menu-popup[hidden]{display:none}
.image-menu-popup button{background:0 0;border:0;text-align:left;padding:6px 9px;border-radius:6px;cursor:pointer;font-size:var(--fs-body);color:var(--text);width:100%}
.image-menu-popup button:hover{background:var(--bg-3)}
.image-menu-popup button[aria-checked=true]{background:var(--bg-3);font-weight:600}
.image-menu-heading{color:var(--text-2);padding:5px 9px 2px;font-size:var(--fs-anno)}
.image-quality-control{container-type:inline-size}
.image-canvas{display:flex;align-items:flex-end;gap:8px;flex-wrap:wrap}
.image-canvas>label{flex:1 1 84px}
.image-canvas>span{padding-bottom:6px}
.image-canvas .image-menu{margin-left:auto}
.image-output{display:flex;flex-direction:column;gap:12px;padding:16px;min-width:0;min-height:0;overflow:auto}
.image-preview{background:rgba(0,0,0,.08);border-radius:8px;flex:1 0 auto;display:flex;justify-content:center;align-items:center;min-height:300px;overflow:hidden}
.image-preview .empty-state{padding:20px}
.empty-state{text-align:center;color:var(--text-2);padding:40px 16px}
.empty-state>svg{opacity:.6;width:42px;height:42px;margin-bottom:12px}
.empty-state h2{color:var(--text);font-size:1.0625rem;margin:0}
.empty-state p{margin-top:8px;font-size:var(--fs-body)}
.image-output-link{color:var(--text-2);background:0 0;border:0;display:flex;align-items:center;justify-content:center;gap:6px;font-size:var(--fs-anno);cursor:pointer}
.image-gallery{display:flex;flex-direction:column;gap:8px}
.image-gallery:empty{display:none}
.video-size{display:flex;align-items:flex-end;gap:8px}
.video-size label{font-size:.75rem;font-weight:600}
.video-size input{width:80px;margin-top:4px;display:block}
.video-size>span{padding-bottom:6px}
.video-size .image-menu{margin-left:auto}
.video-media{display:flex;flex-direction:column;gap:14px;padding-top:12px}
.video-frames{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.video-sound .field-note{background:color-mix(in srgb,var(--text) 5%,transparent);border-radius:6px;padding:8px}
.video-slider{display:grid;grid-template-columns:1fr auto;gap:4px;font-size:.75rem;align-items:center}
.video-slider input{width:100%;grid-column:1/-1;accent-color:var(--accent)}
.video-slider output{color:var(--text-2);font-variant-numeric:tabular-nums}
.image-controls details summary{cursor:pointer;font-size:var(--fs-body);font-weight:600}
.image-advanced-body,.video-advanced{display:flex;flex-direction:column;gap:12px;padding-top:10px}
.adv-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.adv-label{font-size:.75rem;font-weight:600}
.image-action-row{display:flex;gap:8px;margin-top:14px}
/* —— 配音工作台 —— */
.voice-list{display:flex;flex-direction:column;gap:6px}
.voice-card{display:flex;align-items:center;gap:8px;padding:6px 8px;border:1px solid var(--sep);border-radius:8px;min-width:0}
.voice-card .vc-name{flex:1 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:var(--fs-body)}
.voice-card .vc-eng{flex:0 0 auto;max-width:38%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dub-lines{display:flex;flex-direction:column;gap:8px;max-height:340px;overflow-y:auto}
.dub-line{display:flex;flex-direction:column;gap:6px;padding:8px;border:1px solid var(--sep);border-radius:8px}
.dub-line textarea{width:100%;height:46px;min-height:46px;resize:vertical;font:inherit;border-radius:6px;padding:6px}
.dub-meta{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.dub-meta select{flex:1 1 auto;min-width:0;font-size:.75rem}
.dub-out{display:flex;gap:8px;align-items:flex-start;padding:8px;border-top:1px solid var(--sep)}
.dub-out-idx{flex:0 0 22px;height:22px;border-radius:11px;background:color-mix(in srgb,var(--text) 8%,transparent);display:flex;align-items:center;justify-content:center;font-size:.7rem;color:var(--text-2)}
.dub-out-body{flex:1 1 auto;min-width:0;display:flex;flex-direction:column;gap:4px}
.dub-out-text{font-size:var(--fs-anno);color:var(--text-2)}
button.generate{width:100%;margin-top:16px;display:inline-flex;align-items:center;justify-content:center;gap:7px}
.video-screen .image-action-row button.generate{margin-top:0;flex:1}
.video-screen .image-preview video{object-fit:contain;width:100%;height:100%;max-height:55dvh}
.video-screen .image-preview{min-height:240px}
.audio-screen{display:flex;flex-direction:column;height:100%;min-height:0}
.audio-tabs{align-self:center;margin:10px 0 14px;width:min(400px,100% - 32px);display:flex;background:var(--bg-3);border-radius:16px;padding:2px}
.audio-tabs button{flex:1;min-height:28px;padding:6px 12px}
.audio-screen .image-screen{flex:1;min-height:0}
.audio-pane[hidden]{display:none}
.audio-duration{display:grid;grid-template-columns:1fr auto;gap:4px;font-size:.75rem;align-items:center}
.audio-duration input{width:100%;grid-column:1/-1;accent-color:var(--accent)}
.audio-clip .image-drop-well{display:flex;align-items:stretch}
.audio-clip .image-drop-well>button{flex:1;width:50%}
.modern-deck{background:var(--bg-3);border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:12px}
.modern-top{display:flex;gap:14px;align-items:flex-start}
.modern-cover{width:96px;height:96px;border-radius:8px;background:linear-gradient(135deg,#4a90d9,#2b5c9e);flex:none}
.modern-main{flex:1;min-width:0;display:flex;flex-direction:column;gap:10px}
.modern-seek{height:4px;background:var(--sep);border-radius:2px;overflow:hidden}
.modern-seek>span{display:block;height:100%;width:0;background:var(--accent);transition:width .2s}
.modern-controls{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.modern-controls .iconbtn{background:0 0;border:0;color:var(--text);padding:4px;cursor:pointer;border-radius:6px;display:inline-flex}
.modern-controls .iconbtn:hover{color:var(--accent);background:color-mix(in srgb,var(--text) 8%,transparent)}
.modern-controls .iconbtn[aria-pressed=true]{color:var(--accent)}
.playbtn{width:38px;height:38px;border-radius:50%;border:0;background:var(--text-2);color:#fff;display:inline-flex;align-items:center;justify-content:center;cursor:pointer}
.playbtn:hover{opacity:.85}
.modern-controls input[type=range]{width:86px;accent-color:var(--accent)}
.eq{display:inline-flex;align-items:flex-end;gap:2px;height:14px}
.eq>i{width:3px;height:5px;background:var(--accent);border-radius:1px;display:block}
.eq>i:nth-child(2){height:11px}.eq>i:nth-child(3){height:8px}.eq>i:nth-child(4){height:13px}
.modern-radio{display:flex;align-items:center;gap:8px}
.modern-radio input[type=text]{flex:1;min-width:0;background:var(--bg);border:1px solid var(--sep);border-radius:7px;padding:6px 9px;font:inherit}
.modern-radio .chip{flex:none}
.modern-radio input{flex:1}
.modern-history{display:flex;flex-direction:column;gap:8px}
.modern-history h2{color:var(--text-2);margin:0;font-size:var(--fs-anno)}
@media (max-width:980px){
  .image-screen{grid-template-columns:1fr;height:auto}
  .image-controls{border-right:0;border-bottom:1px solid var(--sep)}
  /* 窄屏: 两 栏 摞 成 一 栏 -> 让 整页 滚, 别 把 内容 切 掉 */
  .pages.media-mode{overflow:auto}
  .pages.media-mode>.page{height:auto}
  #mus-pane-create{overflow:visible;height:auto;flex:none}
}
/* ---------- 音乐 (出歌工作台 合并 进 来) ---------- */
.music-screen{display:flex;flex-direction:column;height:100%;min-height:0}
.music-tabs{align-self:center;margin:10px 0 14px;width:min(480px,100% - 32px);display:flex;background:var(--bg-3);border-radius:16px;padding:2px}
.music-tabs button{flex:1;min-height:28px;padding:6px 12px}
.music-pane[hidden]{display:none}
.music-full{flex:1;min-height:0;overflow:auto;padding:0 22px 28px}
/* 创作 栏 自己 滑动 —— 参数 很长 (BPM/调性/步数/种子...), 下面 的 「生成」按钮
   不能 被 切 出 视口. 之前 这 一 层 没 有 flex:1, 高度 是 内容 高, 所以 左栏 根本 不 会 滚. */
#mus-pane-create{flex:1;min-height:0;overflow:hidden}
/* macOS 滚动条 默认 是 overlay (不 滚 就 看 不 见) —— 画 出来, 让 人 知道 下面 还有 */
.image-controls::-webkit-scrollbar,.image-output::-webkit-scrollbar{width:11px}
.image-controls::-webkit-scrollbar-track,.image-output::-webkit-scrollbar-track{background:transparent}
.image-controls::-webkit-scrollbar-thumb,.image-output::-webkit-scrollbar-thumb{
  background:color-mix(in srgb,var(--text) 20%,transparent);
  border:3px solid transparent;background-clip:content-box;border-radius:8px}
.image-controls::-webkit-scrollbar-thumb:hover,.image-output::-webkit-scrollbar-thumb:hover{
  background:color-mix(in srgb,var(--text) 38%,transparent);background-clip:content-box}
.music-table{width:100%;border-collapse:collapse;font-size:var(--fs-body)}
.music-table th{text-align:left;font-weight:600;color:var(--text-2);font-size:var(--fs-anno);
  padding:7px 10px;border-bottom:1px solid var(--sep);position:sticky;top:0;background:var(--bg)}
.music-table td{padding:7px 10px;border-bottom:1px solid var(--sep);vertical-align:top}
.music-table tr:hover td{background:color-mix(in srgb,var(--text) 3%,transparent)}
.music-table .t-title{font-weight:600;max-width:340px;overflow-wrap:anywhere}
.music-table .t-tags{color:var(--text-2);font-size:var(--fs-anno);max-width:420px;overflow-wrap:anywhere}
.music-table .t-num{color:var(--text-2);font-variant-numeric:tabular-data;white-space:nowrap}
.music-table .t-no{color:var(--text-2);font-size:var(--fs-anno);font-variant-numeric:tabular-data}
.music-empty{padding:36px 16px;text-align:center;color:var(--text-2)}
.music-head{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:0 0 12px}
.music-head h2{margin:0;font-size:var(--fs-title,1.05rem)}
.music-head .chip{margin-left:auto}
.music-progress{height:4px;background:var(--sep);border-radius:2px;overflow:hidden;margin-top:10px}
.music-progress>span{display:block;height:100%;width:0;background:var(--accent);transition:width .25s}
.music-progress.indet>span{width:35%;animation:musicSlide 1.1s linear infinite}
@keyframes musicSlide{0%{margin-left:-35%}100%{margin-left:100%}}
.music-log{background:var(--bg-3);border-radius:8px;padding:10px 12px;font-size:var(--fs-anno);
  font-family:ui-monospace,SFMono-Regular,Menlo,monospace;white-space:pre-wrap;overflow:auto;max-height:320px}
.music-player{display:flex;flex-direction:column;gap:10px}
.music-player audio{width:100%}
.music-engine-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.music-engine-row select{flex:1;min-width:180px}
.music-engine-row .chip{flex:none}
/* —— 视频 页: 批量 首尾帧 —— */
.video-top-tabs{margin-bottom:12px;align-self:flex-start}
/* 批量 页 单独 排版: 选图池 占 整 行, 下面 再 分 「参数 | 进度结果」 两 栏 */
.v-batch-screen{grid-template-columns:minmax(330px,.9fr) minmax(360px,1.25fr) !important}
.v-batch-screen>.image-controls{border-right:1px solid var(--sep);min-width:0}
.v-batch-screen>.image-output{min-width:0}
.v-batch-ctrl fieldset{gap:18px}
.v-step{position:relative;padding-left:26px}
.v-stepno{position:absolute;left:0;top:1px;width:19px;height:19px;border-radius:50%;
  background:var(--accent);color:#fff;font-size:.72rem;font-weight:700;line-height:19px;text-align:center}
.v-step .image-heading>label{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.v-batch-params{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.v-batch-params label{font-size:.72rem}
.v-batch-addrow{display:flex;gap:8px;margin-top:8px}
.v-batch-addrow .chip{align-self:flex-start;width:auto}
.v-batch-pool{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:8px;margin:10px 0;
  max-height:28vh;overflow-y:auto;min-height:64px}
.v-batch-empty{grid-column:1/-1;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:6px;padding:18px 12px;border:1px dashed var(--sep);border-radius:8px;color:var(--text-2);
  font-size:.78rem;text-align:center}
.v-batch-item{position:relative;margin:0;border:1px solid var(--sep);border-radius:8px;overflow:hidden;background:var(--bg-3)}
.v-batch-item img{display:block;width:100%;aspect-ratio:16/10;object-fit:cover}
.v-batch-item figcaption{font-size:var(--fs-anno);padding:4px 6px;color:var(--text-2);overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap}
.v-batch-rm{position:absolute;top:4px;right:4px;width:22px;height:22px;border-radius:50%;border:0;
  background:rgba(0,0,0,.62);color:#fff;font-size:14px;line-height:1;cursor:pointer}
.v-batch-results{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px;margin-top:12px}
.v-batch-res{margin:0;border:1px solid var(--sep);border-radius:8px;overflow:hidden;background:var(--bg-3)}
.v-batch-res video{display:block;width:100%;aspect-ratio:16/9;object-fit:contain;background:#000}
.v-batch-res figcaption{font-size:var(--fs-anno);padding:5px 8px;color:var(--text-2)}
/* 配对 预览 —— 让 人 一 眼 看出 会 出 什么 */
.v-batch-pairs{display:grid;grid-template-columns:repeat(auto-fill,minmax(168px,1fr));gap:8px;
  margin:8px 0 16px;max-height:38vh;overflow-y:auto}
.v-pair{margin:0;border:1px solid var(--sep);border-radius:8px;overflow:hidden;background:var(--bg-3)}
.v-pair-imgs{display:flex;align-items:center;gap:0;background:#000;aspect-ratio:16/9}
.v-pair-imgs img{width:50%;height:100%;object-fit:cover;display:block}
.v-pair-imgs img:only-child{width:100%}
.v-arrow{flex:0 0 18px;text-align:center;color:#fff;font-size:13px;opacity:.85}
.v-pair figcaption{font-size:var(--fs-anno);padding:4px 7px;color:var(--text-2);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.v-pair-cap b{color:var(--text-1);font-weight:600}
.v-pair-empty{grid-column:1/-1;padding:16px;border:1px dashed var(--sep);border-radius:8px;
  color:var(--text-2);font-size:.78rem;text-align:center}
@media (max-width:1000px){
  .v-batch-screen{grid-template-columns:minmax(0,1fr) !important}
  .v-batch-screen>.image-controls{border-right:0;border-bottom:1px solid var(--sep)}
}
/* —— 视频 页: MV 工作台 —— */
.v-mv-seq{display:flex;gap:8px;overflow-x:auto;padding:6px 2px 12px;min-height:92px;align-items:flex-start}
.v-mv-seq:empty{display:flex;align-items:center;justify-content:center;width:100%;
  border:1px dashed var(--sep);border-radius:8px}
.v-mv-seq:empty::before{content:"还 没 关键帧 —— 点 上面 的 按钮 挑 几张 图";color:var(--text-2);font-size:.78rem}
.v-mv-frame{position:relative;flex:0 0 138px;border:1px solid var(--sep);border-radius:8px;overflow:hidden;background:var(--bg-3)}
.v-mv-frame img{display:block;width:100%;aspect-ratio:16/10;object-fit:cover}
.v-mv-no{position:absolute;left:4px;top:4px;min-width:19px;height:19px;padding:0 5px;border-radius:10px;
  background:var(--accent);color:#fff;font-size:.68rem;font-weight:700;line-height:19px;text-align:center}
.v-mv-ops{position:absolute;right:4px;bottom:4px;display:flex;gap:4px}
.v-mv-ops button{width:24px;height:24px;border-radius:6px;border:0;background:rgba(0,0,0,.62);color:#fff;
  font-size:13px;line-height:1;cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0}
.v-mv-ops button:hover{background:rgba(0,0,0,.85)}
.v-mv-ops button[disabled]{opacity:.3;cursor:default}
.v-mv-music{display:flex;gap:10px;align-items:center;margin-top:8px;flex-wrap:wrap}
.v-mv-music select{flex:1;min-width:170px}
.v-mv-music audio{width:100%;max-width:330px}
.v-mv-final-note{margin-left:8px}
/* —— 视频 页: 首尾帧 的 镜头 列表 (分镜) —— */
.v-shotlist{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.v-shotlist-head{display:flex;align-items:center;justify-content:space-between;
  font-size:.78rem;color:var(--text-2)}
.v-shot-row{display:grid;grid-template-columns:22px minmax(0,1fr) 26px;gap:8px;align-items:start;
  border:1px solid var(--sep);border-radius:8px;padding:8px;background:var(--bg-3)}
.v-shot-row .v-shot-no{width:20px;height:20px;border-radius:50%;background:var(--accent);color:#fff;
  font-size:.7rem;font-weight:700;line-height:20px;text-align:center;margin-top:4px}
.v-shot-main{display:flex;flex-direction:column;gap:8px;min-width:0}
.v-shot-prompt{width:100%!important;height:60px!important;min-height:60px!important;resize:vertical;
  font:inherit;border-radius:6px;padding:6px 8px;line-height:1.5}
.v-shot-frames{display:flex;gap:8px}
.v-shot-pick{position:relative;width:88px;height:50px;border-radius:6px;border:1px dashed var(--sep);
  background:var(--bg-2);display:flex;align-items:center;justify-content:center;font-size:.7rem;
  color:var(--text-2);cursor:pointer;overflow:hidden;padding:0}
.v-shot-pick img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.v-shot-pick span{position:relative;z-index:1}
.v-shot-rm{width:26px;height:26px;border-radius:6px;border:0;background:rgba(0,0,0,.06);
  color:var(--text-2);cursor:pointer;font-size:14px;line-height:1;padding:0}
.v-shot-rm:hover{background:rgba(0,0,0,.12)}
.music-tracks{display:flex;flex-direction:column;gap:6px}
.music-track{display:flex;align-items:center;gap:8px;padding:6px 8px;border:1px solid var(--sep);
  border-radius:7px;font-size:var(--fs-anno)}
.music-track .mt-name{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.music-track .mt-meta{color:var(--text-2);white-space:nowrap}
.music-track button{background:0 0;border:0;color:var(--accent);cursor:pointer;font-size:var(--fs-anno);padding:2px 6px;border-radius:5px}
.music-track button:hover{background:color-mix(in srgb,var(--accent) 12%,transparent)}
.music-tags{display:flex;flex-wrap:wrap;gap:5px}
.music-tags-wrap{max-height:132px;overflow:auto;padding:2px 2px 4px;border:1px solid var(--sep);
  border-radius:8px;background:var(--bg-3)}
.music-tag{border:1px solid var(--sep);border-radius:6px;padding:3px 8px;font-size:var(--fs-anno);
  background:0 0;color:var(--text);cursor:pointer}
.music-tag[aria-pressed=true]{background:var(--accent);color:#fff;border-color:transparent}
.music-stats{display:flex;gap:14px;flex-wrap:wrap;color:var(--text-2);font-size:var(--fs-anno)}
.music-stats b{color:var(--text);font-variant-numeric:tabular-data}
/* ---------- 资料库 (照 闭源: section-bar + filters + items) ---------- */
#page-library{max-width:1280px;margin:0 auto}
.section-bar{display:flex;align-items:center;gap:6px;padding:8px 12px;border-bottom:1px solid var(--sep)}
.section-bar h1{font-size:var(--fs-title);font-weight:700;margin:0;letter-spacing:-.4px}
.section-bar>button{margin-left:auto}
.section-bar>button+button{margin-left:0}
.section-description{color:var(--text-2);margin-top:4px;font-size:.75rem}
.library-filters{display:flex;flex-wrap:wrap;align-items:flex-end;gap:12px;margin:20px 0 12px}
.library-filters>label{display:flex;flex-direction:column;gap:5px;min-width:0;font-size:.75rem}
.library-filters .search-field{flex:1 1 220px;flex-direction:row;align-items:center;gap:8px;background:var(--bg-3);border-radius:7px;margin:0;padding:5px 9px}
.library-filters .search-field input{background:0 0;border:0;width:100%;padding:3px}
.library-filters select{min-width:100px;max-width:300px}
.library-items{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,290px),1fr));gap:12px;margin-top:18px}
.lib-more{display:flex;align-items:center;justify-content:center;gap:12px;margin-top:18px;flex-wrap:wrap}
.lib-more .mono{color:var(--text-2);font-size:var(--fs-anno)}
/* 媒体 懒加载 容器: 资料库 可能 有 上千 条 产物 —— 一次性 把 <img>/<video>/<audio>
   全 塞 进 DOM 会 把 WebKit 主线程 和 网络 队列 堵死 (点 别 的 都 变 慢). */
.lazy-media{display:flex;align-items:center;justify-content:center;gap:8px;min-height:110px;
  background:var(--bg-3);color:var(--text-2);padding:10px}
.library-items .media-item img{aspect-ratio:4/3;object-fit:contain;background:var(--bg-3)}
.library-items .lazy-media{aspect-ratio:4/3;min-height:0}
.lazy-play{width:42px;height:42px;flex:0 0 42px;border-radius:50%;border:1px solid var(--sep);
  background:var(--bg);color:var(--text);font-size:15px;cursor:pointer;display:flex;
  align-items:center;justify-content:center;padding:0}
.lazy-play:hover{border-color:var(--accent);color:var(--accent)}
.lazy-name{font-size:var(--fs-anno);max-width:60%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lazy-media video{width:100%;display:block;background:#000}
.lazy-media audio{width:100%}

</style>
</head>
<body>
<div id="app">
  <aside class="sidebar" id="sidebar">
    <a class="skip" href="#pages">跳至内容</a>
    <div class="side-top"><button class="side-toggle" id="side-toggle" title="收起侧栏"></button></div>
    <nav class="nav" id="nav"></nav>
    <div class="nav" id="sess-box">
      <div class="group">会话</div>
      <button class="newchat" id="btn-new-chat"><span class="ic"></span>新建聊天</button>
      <div id="sess-list"></div>
    </div>
    <div class="side-foot">
      <div class="srv-box"><span class="dot" id="side-dot"></span><span id="side-state">此服务器</span></div>
      <div class="srv-stats" id="srv-line">—</div>
      <div class="mono srv-addr" id="side-addr"></div>
    </div>
  </aside>
  <main class="content">
    <header class="topbar">
      <button class="iconbtn" id="menu-btn" title="菜单">☰</button>
      <h1 id="page-title">对话</h1>
      <div class="spacer"></div>
      <button class="chip" id="lang-btn" title="语言">中</button>
      <button class="iconbtn" id="theme-btn" title="切换主题">◐</button>
    </header>
    <div class="pages" id="pages">
      <section class="page" id="page-chat"></section>
      <section class="page" id="page-monitor"></section>
      <section class="page" id="page-library"></section>
      <section class="page" id="page-models"></section>
      <section class="page" id="page-image"></section>
      <section class="page" id="page-video"></section>
      <section class="page" id="page-audio"></section>
      <section class="page" id="page-voice"></section>
      <section class="page" id="page-music"></section>
      <section class="page" id="page-api"></section>
      <section class="page" id="page-settings"></section>
      <section class="page" id="page-launcher"></section>
    </div>
  </main>
</div>
<div class="toast" id="toast"></div>
<script>
/* ============================================================ 基础 */
const $ = (s, r) => (r || document).querySelector(s);
const $$ = (s, r) => Array.from((r || document).querySelectorAll(s));
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
// ---------- 图标: lucide 风格 的 内联 SVG (照 闭源 Studio 的 线性 图标) ----------
const ICON = {
  models:'<path d="M21 8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16Z"/><path d="m3.3 7 8.7 5 8.7-5"/><path d="M12 22V12"/>',
  monitor:'<path d="M22 12h-4l-3 9L9 3l-3 9H2"/>',
  api:'<path d="m4 17 6-6-6-6"/><path d="M12 19h8"/>',
  settings:'<circle cx="12" cy="12" r="3"/><path d="M12 2v2.5M12 19.5V22M4.2 4.2l1.8 1.8M18 18l1.8 1.8M2 12h2.5M19.5 12H22M4.2 19.8 6 18M18 6l1.8-1.8"/>',
  image:'<rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="9" cy="9" r="2"/><path d="m21 15-3.1-3.1a2 2 0 0 0-2.8 0L6 21"/>',
  video:'<rect x="2" y="4" width="20" height="16" rx="2"/><path d="M7 4v16M17 4v16M2 9h5M2 15h5M17 9h5M17 15h5"/>',
  audio:'<path d="M2 10v3M6 6v11M10 3v18M14 8v7M18 5v13M22 10v3"/>',
  library:'<path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2Z"/>',
  launcher:'<path d="m16 18 6-6-6-6"/><path d="m8 6-6 6 6 6"/>',
  plus:'<path d="M12 5v14M5 12h14"/>',
  chat:'<path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>',
  sparkles:'<path d="m12 3 1.9 5.8L20 10.7l-5.3 3.4L16 20l-4-3.2L8 20l1.3-5.9L4 10.7l6.1-1.9Z"/>',
  search:'<circle cx="11" cy="11" r="7.5"/><path d="m21 21-4.3-4.3"/>',

const LS_SESS = 'mlx.sessions';
function loadSessions() {
  try { state.sessions = JSON.parse(localStorage.getItem(LS_SESS) || '[]') || []; }
  catch (e) { state.sessions = []; }
  if (!state.sessions.length) {
    state.sessions = [{ id: 's' + Date.now(), title: '', msgs: [], at: Date.now() }];
  }
  if (!state.sessions.find(x => x.id === state.session)) state.session = state.sessions[0].id;
}
function saveSessions() {
  try { localStorage.setItem(LS_SESS, JSON.stringify(state.sessions.slice(-40))); } catch (e) { /* 配额 */ }
}
function curSession() {
  return state.sessions.find(x => x.id === state.session) || state.sessions[0];
}
function newSession() {
  // 当前 会话 还是 空 的 (没 发 过 消息、没 标题) —— 别 再 造 一个 空的,
  // 否则 侧栏 会 堆 一 串 都 叫「新建聊天」的 空 条目 (看着 像 出 bug).
  const cur0 = curSession();
  if (cur0 && !(cur0.msgs && cur0.msgs.length) && !cur0.title) {
    go('chat');
    const inp0 = $('#input'); if (inp0) inp0.focus();
    return;
  }
  const s = { id: 's' + Date.now(), title: '', msgs: [], at: Date.now() };
  state.sessions.push(s); state.session = s.id; saveSessions(); renderSessList();
  go('chat');
  const inp = $('#input'); if (inp) inp.focus();
}
function renderSessList() {
  const box = $('#sess-list'); if (!box) return;
  const cur = state.session;
  // 空 会话 (没 消息) 不 上 列表 —— 只 保留 当前 那 一 个, 免得 一 堆「新建聊天」占 位置
  const list = state.sessions.filter(s => (s.msgs && s.msgs.length) || s.id === cur);
  box.innerHTML = list.slice().reverse().map(s => {
    const t = (s.title || tr('newchat')).replace(/[<>&]/g, '');
    return `<button class="sess${s.id === cur ? ' active' : ''}" data-sess="${s.id}">` +
           `<span class="ic sess-i">${svg('chat', 15)}</span>` +
           `<span class="sess-t">${esc(t)}</span>` +
           `<span class="sess-x" data-del="${s.id}" title="删除">${svg('more', 14)}</span></button>`;
  }).join('');
  $$('#sess-list .sess').forEach(b => b.onclick = e => {
    if (e.target.dataset.del) {
      e.stopPropagation();
      const id = e.target.dataset.del;
      state.sessions = state.sessions.filter(x => x.id !== id);
      if (!state.sessions.length) state.sessions = [{ id: 's' + Date.now(), title: '', msgs: [], at: Date.now() }];
      if (state.session === id) state.session = state.sessions[0].id;
      saveSessions(); renderSessList(); go('chat');
      return;
    }
    state.session = b.dataset.sess; saveSessions(); renderSessList(); go('chat');
  });
}

function confirmDialog(o) {
  o = o || {};
  return new Promise(resolve => {
    const wrap = document.createElement('div');
    wrap.className = 'modal-scrim';
    wrap.innerHTML = `<div class="modal" role="dialog" aria-modal="true">
      <h3>${esc(o.title || '确认')}</h3>
      <p>${o.body || ''}</p>
      <div class="modal-actions">
        <button type="button" class="ghost" id="md-cancel">取消</button>
        <button type="button" class="primary${o.danger ? ' danger' : ''}" id="md-ok">${esc(o.ok || '确定')}</button>
      </div></div>`;
    document.body.appendChild(wrap);
    const onKey = (e) => { if (e.key === 'Escape') { e.preventDefault(); done(false); } };
    const done = (v) => {
      document.removeEventListener('keydown', onKey);
      wrap.remove();
      resolve(v);
    };
    wrap.querySelector('#md-cancel').onclick = () => done(false);
    wrap.querySelector('#md-ok').onclick = () => done(true);
    wrap.onclick = (e) => { if (e.target === wrap) done(false); };
    document.addEventListener('keydown', onKey);
    const okBtn = wrap.querySelector('#md-ok');
    if (okBtn) okBtn.focus();
  });
}
async function api(path, opts) {
  opts = opts || {};
  const base = state.server && state.server !== location.origin ? state.server : '';
  const headers = opts.body ? { 'Content-Type': 'application/json' } : {};
  if (state.apiKey) headers['Authorization'] = 'Bearer ' + state.apiKey;
  const t0 = performance.now();
  const rec = { path, method: opts.method || 'GET', at: Date.now() };
  const res = await fetch(base + path, {
    method: opts.method || 'GET',
    headers,
    body: opts.body ? JSON.stringify(opts.body) : undefined,
  });
  const text = await res.text();
  rec.ms = Math.round(performance.now() - t0);
  rec.status = res.status;
  state.history.unshift(rec);
  if (state.history.length > 50) state.history.length = 50;
  let data = null;
  try { data = JSON.parse(text); } catch (e) { data = text; }
  if (!res.ok) {
    const msg = (data && data.error && data.error.message) || ('HTTP ' + res.status);
    const err = new Error(msg); err.status = res.status; err.data = data; throw err;
  }
  return data;
}

async function runTool(name, args) {
  if (name === 'generate_image' || name === 'edit_image') {
    const body = { model: 'krea-turbo', prompt: args.prompt || '' };
    if (args.size) body.size = args.size;
    const r = await api('/v1/images/generations', { method: 'POST', body });
    const it = (r.data || [])[0] || {};
    return { text: '图片 已 生成', media: it.b64_json ? 'data:image/png;base64,' + it.b64_json : it.url };
  }
  if (name === 'generate_speech') {
    const r = await api('/v1/audio/speech', { method: 'POST', body: { model: 'ours/tts', input: args.prompt || args.input || '' } });
    const b = r.data && r.data[0] && r.data[0].b64_json;
    return { text: '语音 已 生成', media: b ? 'data:audio/wav;base64,' + b : null };
  }
  if (name === 'generate_music') {
    const body = { prompt: args.prompt || '', duration_seconds: args.duration_seconds || 60 };
    if (args.lyrics) body.lyrics = args.lyrics;
    if (args.instrumental) body.instrumental = true;
    const r = await api('/v1/audio/music-generations', { method: 'POST', body });
    const it = (r.data || [])[0] || {};
    const b = it.b64_json;
    const mime = audioMime(it.url, 'audio/mpeg');
    return { text: '音乐 已 生成' + (r.engine ? ' (' + r.engine + ')' : ''),
             media: b ? 'data:' + mime + ';base64,' + b : null };
  }
  if (name === 'generate_sound') {
    const body = { prompt: args.prompt || '', duration_seconds: args.duration_seconds || 10 };
    const r = await api('/v1/audio/sound-generations', { method: 'POST', body });
    const b = r.data && r.data[0] && r.data[0].b64_json;
    return { text: '音效 已 生成', media: b ? 'data:audio/wav;base64,' + b : null };
  }
  if (name === 'generate_video') {
    const r = await api('/v1/video/generations', { method: 'POST', body: { model: 'h3-4bit', prompt: args.prompt || '' } });
    return { text: '视频 已 生成: ' + (r.url || ''), media: r.url };
  }
  if (name === 'search_library') {
    const lib = await api('/v1/library');
    const q = (args.query || '').toLowerCase();
    const hits = (lib.items || []).filter(it => !q || (it.prompt || '').toLowerCase().indexOf(q) >= 0).slice(0, 5);
    return { text: hits.length ? hits.map(x => x.type + ': ' + (x.prompt || x.name)).join(' | ') : '资料库 里 没 找到' };
  }
  return { text: '未知 工具: ' + name };
}
/* 工具 产物 的 真实 文件名 —— 小模型 很 爱 编 一个 "rain_sound_001.wav" 之类 的
   假 文件名, 所以: ① 回灌 时 把 真实 清单 给 它 看; ② 它 写 出来 的 文件名
   跟 清单 对 不上 就 换掉. */
const FILE_RE = /([\w\u4e00-\u9fa5][\w\u4e00-\u9fa5\-]*\.(wav|mp3|m4a|flac|aiff|ogg|opus|mp4|mov|m4v|webm|png|jpe?g|gif|webp|svg))/gi;
async function realArtifacts() {
  try {
    const lib = await api('/v1/library', { method: 'GET' });
    return (lib.items || []).map(it => it.name).filter(Boolean);
  } catch (e) { return []; }
}
function sanitizeFiles(text, allowed) {
  if (!text) return text;
  const set = new Set(allowed.map(a => String(a).toLowerCase()));
  const only = allowed.length === 1 ? allowed[0] : null;
  return text.replace(FILE_RE, (m) => {
    const base = m.split('/').pop().trim();
    if (set.has(m.toLowerCase()) || set.has(base.toLowerCase())) return m;
    return only ? only : '生成的产物';
  });
}

async function sendPlain(text, msgs) {
  addMsg('user', text);
  const bot = addMsg('assistant', '');
  const bubble = $('.bubble', bot);
  const think = document.createElement('div');
  think.className = 'think';
  think.innerHTML = '<b>思考</b>';
  const thinkBody = document.createElement('div');
  think.appendChild(thinkBody);
  bot.lastElementChild.insertBefore(think, bubble);
  let reasoning = '';
  const foot = document.createElement('div');
  foot.className = 'msg-foot';
  bot.lastElementChild.appendChild(foot);
  const t0 = performance.now();
  let first = 0, tokens = 0;
  try {
    const body = {
      model: state.chatModel, messages: (msgs || []).map(m => ({ role: m.role, content: m.content })),
      stream: true, max_tokens: 1024, stream_options: { include_usage: true },
    };
    if (!state.thinking) body.enable_thinking = false;
    const res = await fetch('/v1/chat/completions', {
      method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body),
    });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const reader = res.body.getReader(); const dec = new TextDecoder(); let buf = '';
    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buf += dec.decode(value, { stream: true });
      const lines = buf.split('\n'); buf = lines.pop();
      for (const line of lines) {
        if (!line.startsWith('data:')) continue;
        const payload = line.slice(5).trim();
        if (payload === '[DONE]') continue;
        let obj; try { obj = JSON.parse(payload); } catch (e) { continue; }
        if (obj.usage && obj.usage.total_tokens) state.usedTokens = obj.usage.total_tokens;
        const d = obj.choices && obj.choices[0] && obj.choices[0].delta;
        if (d && (d.content || d.reasoning_content)) {
          if (!first) first = performance.now();
          tokens++;
          if (d.reasoning_content) {
            reasoning += d.reasoning_content;
            thinkBody.textContent = reasoning;
          }
          if (d.content) bubble.textContent += d.content;
          $('#chat-scroll').scrollTop = $('#chat-scroll').scrollHeight;
        }
      }
    }
    if (!bubble.textContent) {
      // 说清 原因: 思考 把 预算 吃光 时 回答 会 是 空 的 (原版 也 这 个 毛病)
      bubble.textContent = reasoning
        ? '(思考 超出 token 预算 被 截断, 没 生成 回答 — 关 掉"思考" 再 试)'
        : '(空 响应)';
      bubble.classList.add('warn');
    }
    if (!reasoning) think.remove();
    (msgs || []).push({ role: 'assistant', content: bubble.textContent });
    addSpeakBtn(bot, bubble.textContent);
    const dt = (performance.now() - t0) / 1000;
    foot.innerHTML = `<span>${tokens} tok · ${dt.toFixed(1)}s${first ? ' · 首字 ' + ((first - t0) / 1000).toFixed(2) + 's' : ''}</span>`;
  } catch (e) {
    bubble.textContent = '失败：' + e.message;
    bubble.style.color = 'var(--error)';
  }
}

async function sendWithTools(text, msgs) {
  addMsg('user', text);
  const bot = addMsg('assistant', '');
  const bubble = $('.bubble', bot);
  bubble.textContent = '思考 要 调 什么 工具…';
  try {
    const r = await api('/v1/chat/completions', { method: 'POST', body: {
      model: state.chatModel, messages: msgs.map(m => ({ role: m.role, content: m.content })),
      tools: TOOLS, tool_choice: 'auto', max_tokens: 1024, stream: false,
    } });
    const msg = (r.choices && r.choices[0] && r.choices[0].message) || {};
    const calls = msg.tool_calls || [];
    if (!calls.length) {
      bubble.textContent = msg.content || '(空 响应)';
      msgs.push({ role: 'assistant', content: bubble.textContent });
      addSpeakBtn(bot, bubble.textContent);
      return;
    }
    bubble.textContent = '';
    const outs = [];
    const artifacts = [];
    const before = new Set(await realArtifacts());
    for (const c of calls) {
      const name = c.function && c.function.name;
      let args = {};
      try { args = JSON.parse((c.function && c.function.arguments) || '{}'); } catch (e) { args = {}; }
      const card = toolCard(bot, name, args, '执行中…');
      try {
        const res = await runTool(name, args);
        card.querySelector('b').nextSibling.textContent = ' · ' + res.text;
        if (res.media) {
          const m = document.createElement('div');
          m.className = 'media-item';
          if (/^data:image/.test(res.media)) m.innerHTML = '<img src="' + esc(res.media) + '" alt="">';
          else if (/^data:audio/.test(res.media)) m.innerHTML = '<audio controls src="' + esc(res.media) + '" style="width:100%"></audio>';
          else m.innerHTML = '<a class="ghost" href="' + esc(res.media) + '" target="_blank">打开 产物</a>';
          card.appendChild(m);
        }
        outs.push(name + ' → ' + res.text);
        const now = await realArtifacts();
        artifacts.push(...now.filter(n => !before.has(n)));
      } catch (e) {
        card.querySelector('b').nextSibling.textContent = ' · 失败: ' + e.message;
        outs.push(name + ' → 失败: ' + e.message);
      }
    }
    const artList = [...new Set(artifacts)].slice(0, 6);
    msgs.push({ role: 'assistant', content: '工具 结果: ' + outs.join(' | ') });
    msgs.push({ role: 'user', content:
      '请 根据 上面 的 工具 结果 回答 我。' +
      (artList.length ? '\n真实产物清单 (只能引用这些文件名, 不要编造别的文件名): ' + artList.join(', ') : '') });
    bubble.textContent = '整理 结果…';
    let gotText = false;
    const r2 = await fetch((state.server || '') + '/v1/chat/completions', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        model: state.chatModel, messages: msgs.map(m => ({ role: m.role, content: m.content })),
        max_tokens: 1024, stream: true, stream_options: { include_usage: true },
      }),
    });
    const reader = r2.body.getReader(); const dec = new TextDecoder(); let buf = '';
    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buf += dec.decode(value, { stream: true });
      const lines = buf.split('\n'); buf = lines.pop();
      for (const line of lines) {
        if (!line.startsWith('data:')) continue;
        const p = line.slice(5).trim();
        if (p === '[DONE]') continue;
        let o; try { o = JSON.parse(p); } catch (e) { continue; }
        const d = o.choices && o.choices[0] && o.choices[0].delta;
        if (d && d.content) {
          if (!gotText) { bubble.textContent = ''; gotText = true; }   // 第一 块 正文 到达 时 撤掉 占位
          bubble.textContent += d.content;
        }
      }
    }
    bubble.textContent = sanitizeFiles(bubble.textContent, artList);
    msgs.push({ role: 'assistant', content: bubble.textContent });
    addSpeakBtn(bot, bubble.textContent);
  } catch (e) {
    bubble.textContent = '失败：' + e.message;
    bubble.style.color = 'var(--error)';
  }
}

async function voiceInput() {
  if (!navigator.mediaDevices || !window.MediaRecorder) { toast('浏览器 不 支持 录音'); return; }

  catch (e) { toast('拿 不 到 麦克风：' + e.message); return; }
  const btn = $('#btn-voice');
  btn.classList.add('on');

  const chunks = [];

  btn.onclick = async () => {
    btn.classList.remove('on');
    btn.onclick = () => voiceInput();
    rec.onstop = async () => {
      stream.getTracks().forEach(t => t.stop());
      const blob = new Blob(chunks, { type: 'audio/webm' });
      const fd = new FormData();
      fd.append('file', blob, 'mic.webm');
      try {
        const res = await fetch((state.server || '') + '/v1/audio/transcriptions', { method: 'POST', body: fd });
        const j = await res.json();
        if (j.text) { $('#input').value = j.text; $('#input').focus(); toast('识别：' + j.text); }
        else toast('没 识别 到 语音');
      } catch (e) { toast('识别 失败：' + e.message); }
    };
    rec.stop();
  };
}

function renderHist() {

function sparkBox(key, title) {
  return `<div class="card"><div class="label" style="font-size:var(--fs-anno);color:var(--text-2)">${esc(title)}</div>
    <canvas class="spark" id="spark-${key}"></canvas></div>`;
}
function drawSparks() {
  for (const key of Object.keys(state.hist)) {
    const cv = document.getElementById('spark-' + key); if (!cv) continue;
    const d = state.hist[key]; const w = cv.clientWidth || 300, h = 56;
    cv.width = w * devicePixelRatio; cv.height = h * devicePixelRatio;
    const g = cv.getContext('2d'); g.scale(devicePixelRatio, devicePixelRatio);
    g.clearRect(0, 0, w, h);
    if (d.length < 2) { g.fillStyle = '#707070'; g.font = '11px system-ui'; g.fillText('采样中…', 8, 30); continue; }
    const max = Math.max.apply(null, d) || 1, min = Math.min.apply(null, d);
    const span = (max - min) || 1;
    const accent = getComputedStyle(document.documentElement).getPropertyValue('--accent').trim();
    g.strokeStyle = accent; g.lineWidth = 1.6; g.beginPath();
    d.forEach((v, i) => {
      const x = i / (d.length - 1) * (w - 4) + 2, y = h - 6 - (v - min) / span * (h - 14);
      i ? g.lineTo(x, y) : g.moveTo(x, y);
    });
    g.stroke();
  }
}
async function pollMetrics() {
  try {
    const m = await api('/metrics.json');
    state.metrics = m;
    for (const k of Object.keys(state.hist)) {
      const v = m[k];
      const cap = (RANGES[state.range] || RANGES.live).n;
      if (typeof v === 'number') { state.hist[k].push(v); if (state.hist[k].length > cap) state.hist[k].shift(); }
    }
    // 顶栏 这 个 数字 要 有 用: 没 装 模型 时 报 "空闲 X GiB", 装 了 就 报 权重 实际 占 的 显存.
    // 早 先 一直 报 进程 RSS —— 服务 刚 重启 时 是 0.1 GiB, 看 起来 像 "内存 0 GiB", 没 意义.
    const act = (m.mlx_active_bytes || 0) / (1024 * 1024 * 1024);
    // 「此服务器」 卡片: 服务器 版本 · 模型 数 · 就绪 数 · 常驻 显存
    const ms = state.models || [];
    const ready = ms.filter(x => x.state === 'ready' || x.state === 'loaded').length;
    // 版本 号 取 短 形式 (闭源 是 "26.10.2" 这种), 太长 的 说明 会 撑破 卡片
    const vtxt = (state.version || 'our-kernel').split('(')[0].trim();
    const en = state.lang === 'en';
    const sl = (en
      ? 'Server ' + vtxt + ' · ' + ms.length + ' models · ' + ready + ' ready · Resident ' + act.toFixed(2) + ' GiB'
      : '服务器 ' + vtxt + ' · ' + ms.length + ' 个模型 · ' + ready + ' 个就绪 · 常驻 ' + act.toFixed(2) + ' GiB');
    const sl2 = $('#srv-line'); if (sl2) sl2.textContent = sl;
    const sa = $('#side-addr');
    if (sa) {
      // 闭源 侧栏 底部 显示 的 是 裸 host (127.0.0.1:11296), 不是 整 条 URL
      const host = String(serverBase()).replace(/^https?:\/\//, '').replace(/\/.*$/, '');
      sa.textContent = host + (m.free_gib != null
        ? ' · ' + (en ? 'free ' : '空闲 ') + m.free_gib.toFixed(0) + ' GiB' : '');
    }
    if ($('#page-monitor').classList.contains('active')) { renderMonitor(); }
    const eng = $('#engines-box');
    if (eng) eng.innerHTML = (m.engines && m.engines.length)
      ? m.engines.map(e => `<span class="badge loaded">${esc(e)}</span>`).join(' ')
      : '<span class="badge">空闲</span>';
  } catch (e) { /* 服务 未起 */ }
}

const LIB_TYPES = [['', '所有类型'], ['image', '图像'], ['video', '视频'], ['audio', '语音'], ['music', '音乐'], ['sound', '音效'], ['3d', '3D']];
const LIB_PAGE = 60;
/* 媒体 元素 懒加载: 图片 用 loading=lazy, 视频/音频 先 只 给 一个 播放 按钮,
   用户 真 的 点 播放 才 拉 文件 —— 资料库 一 次 可能 有 上千 条, 全 拉 会 卡死 界面. */
function lazyMedia(it) {
  const url = esc(it.url || '');
  if (it.type === 'image') return `<img loading="lazy" decoding="async" src="${url}" alt="">`;
  if (it.type === '3d') return `<img loading="lazy" decoding="async" src="${esc(it.preview || it.url)}" alt="">`;
  const kind = it.type === 'video' ? 'video' : 'audio';
  const ico = kind === 'video' ? '▶' : '♪';
  return `<div class="lazy-media" data-kind="${kind}" data-url="${url}">
    <button type="button" class="lazy-play" title="播放">${ico}</button>
    <span class="lazy-name">${esc(it.name || it.type)}</span></div>`;
}
/* 点 播放 才 真 的 挂 媒体 元素 (视频 / 音频 之前 一 个 文件 都 不 下) */
function wireLazyMedia(root) {
  $$('.lazy-media', root).forEach(box => {
    const btn = $('.lazy-play', box);
    if (!btn) return;
    btn.onclick = () => {
      const kind = box.dataset.kind || 'audio';
      const url = box.dataset.url;
      if (!url) return;
      const el = document.createElement(kind);
      el.controls = true;
      el.src = url;
      if (kind === 'video') el.preload = 'metadata';
      box.replaceWith(el);
      el.play().catch(() => {});
    };
  });
}
/* 离开 页面 时 把 媒体 源 摘掉 —— 不然 WebKit 会 继续 拉 / 解码,

function unloadMedia(pageId) {
  const el = document.getElementById(pageId);

  });
}

async function enhancePrompt(taId, btnId) {
  const ta = $('#' + taId), btn = $('#' + btnId);
  if (!ta) return;
  const p = ta.value.trim();
  if (!p) { toast('先 写 个 提示词'); return; }
  if (!state.chatModel) { toast('此服务器 没有 对话 模型, 无法 增强'); return; }
  btn.disabled = true; const old = btn.innerHTML;
  btn.innerHTML = svg('sparkles', 12) + '增强中…';
  try {
    const r = await api('/v1/chat/completions', { method: 'POST', body: {
      model: state.chatModel, stream: false, temperature: 0.7,
      messages: [{ role: 'user', content: ENHANCE_HINT + p }],
    } });
    const txt = ((r.choices || [])[0] || {}).message
      ? ((r.choices[0].message.content) || '') : (r.content || '');
    const out = String(txt).trim().replace(/^```[a-z]*\n?|```$/gi, '').trim();
    if (out) { ta.value = out; toast('已 增强'); } else toast('增强 结果 为空');
  } catch (e) { toast('增强 失败：' + e.message); }
  finally { btn.disabled = false; btn.innerHTML = old; }
}
function wireTemplateMenu(btnId, menuId, taId, list) {
  const btn = $('#' + btnId), menu = $('#' + menuId);

  menu.innerHTML = '<span class="image-menu-heading">入门模板</span>' + list.map(t =>
    `<button type="button" role="menuitemradio" data-tpl="${esc(t[0])}" aria-checked="false" title="${esc(t[1].slice(0, 90))}">${esc(t[0])}</button>`).join('');
  btn.onclick = (e) => {
    e.stopPropagation();

    btn.setAttribute('aria-expanded', String(open));
  };
  $$('#' + menuId + ' button[data-tpl]').forEach(b => b.onclick = () => {

  });
}
const EMPTY_PREVIEW = (icon, title, desc) =>

// 生成 按钮 随 提示词 联动 (照 闭源: 空 输入 时 按钮 变灰)
function bindGenToggle(btnId, inputId) {
  const b = $('#' + btnId), inp = $('#' + inputId);
  if (!b || !inp) return;
  const sync = () => { b.classList.toggle('is-empty', !(inp.value || '').trim()); };

  sync();
  return sync;
}

/* ============================================================ 视频生成 (照 闭源 Studio) */
// 质量 档: [名字, 步数, 帧数]
// 注意 步数 直接 决定 耗时 —— H3 的 DiT 是 17B, 每 步 要 按 「画布×帧数」 平方级 地 算,
// 所以 默认 给 一个 「快」 档, 别 一 上手 就 16/30 步 (那是 十几 分钟 起).
const VID_QUALITY = [['preview', 4, 124], ['fast', 8, 124], ['good', 16, 124], ['quality', 30, 209], ['super', 50, 209]];

/* 视频 模型 的 默认 参数 —— 两 个 引擎 的 规矩 不一样, 不能 一 套 通用:
   H3   : 帧数 17n+5 (它 的 打包 粒度), 默认 8 步, 832x480
   Wan2 : 帧数 4n+1  (Wan 的 VAE 时间压缩 是 4), 官方 40 步, 1280x704 (720P)
   Wan 出 720P 静音 画面, 只 有 首帧 —— 完整 首尾帧 得 用 H3. */
const VID_MODEL_DEFAULTS = {
  h3: {
    steps: 8, frames: 124, w: 832, h: 480,
    fmin: 22, fmax: 362, fstep: 17,
    rule: '每秒 24 帧。帧数必须满足 17n+5。',
    note: 'H3 —— 完整 首尾帧 (首帧 + 尾帧 都 能 定), 慢 但 准。',
  },
  wan2: {
    steps: 3, frames: 121, w: 1280, h: 704,
    fmin: 5, fmax: 361, fstep: 4,
    rule: '每秒 24 帧。帧数必须满足 4n+1（Wan 的 时间压缩 是 4）。',
    note: 'Wan2.2 —— 出 720P 静音 画面, 快 很多。只有 首帧 (图生视频), 没有 尾帧。',
  },
};
function vidModelCfg() {
  const id = String((state.mediaModel && state.mediaModel.video) || 'h3-4bit');
  const base = /^wan2/i.test(id) ? VID_MODEL_DEFAULTS.wan2 : VID_MODEL_DEFAULTS.h3;
  // 模型清单 (catalog) 里 的 是 真 值 —— 步数/帧数/画布 照 它 填,
  // 界面 跟 引擎 永远 一 份 账 (别 再 前端 写死 一 份).
  const row = (state.models || []).find(r => r.id === id);
  if (!row) return base;
  const o = Object.assign({}, base);
  if (row.steps) o.steps = row.steps;
  if (row.frames) o.frames = row.frames;
  if (row.width) o.w = row.width;
  if (row.height) o.h = row.height;
  return o;
}
function vidIsWan() {
  const id = String((state.mediaModel && state.mediaModel.video) || 'h3-4bit');
  return /^wan2/i.test(id);
}

// 打包 序列 的 行数 —— 必须 和 内核 port_minimax_h3_mlx/packing.py 一致
//   画布 → VAE latent (÷16) → patch 2 → 每 latent 帧 (W/32)×(H/32) 行
//   帧数 必须 17n+5; latent 帧 = (f-5)/17*5+2; 音频 latent = f/24*40, ×2 声道
function vidRows(w, h, frames) {
  const rw = Math.max(1, Math.floor(w / 32)), rh = Math.max(1, Math.floor(h / 32));
  let f = Math.max(1, Math.round(frames || 124));
  while (f % 17 !== 5) f++;                       // align_num_frames
  const latent = Math.floor((f - 5) / 17) * 5 + 2; // video_latent_num_frames
  const audio = Math.round(f / 24 * 40) * 2;        // audio_latent_num_frames × 声道
  return rw * rh * latent + audio + 10;            // +10 文本 行
}
// 预计 耗时 —— 用 上 一次 实测 的 「秒/步」 换算 (内核 /props 里 有)
// 本机 (M5 Max 128G · MiniMax-H3 DiT 4bit) 的 两个 实测 锚点:
//   704×448 / 124 帧 / 3 次前向 → 21.4 秒/步 (11,847 行)
//   1344×768 / 124 帧 / 7 次前向 → 206 秒/步 (37,747 行)
// 最小二乘 拟合: t_step ≈ 1.378e-4·rows + 1.409e-7·rows²  (平方 项 = 注意力)
const VID_FIT_DEFAULT = { a: 1.378e-4, b: 1.409e-7 };

/* —— 首尾帧 的 分镜 (镜头列表) —— 模块级: 换页 / 重画 不 会 丢 ——
   每个 镜头 = { prompt, first, last, fu, lu }  fu/lu 是 预览 图 (blob URL) */
const vShots = [];

          <button type="button" class="v-shot-pick" data-slot="last" data-i="${i}" title="选 尾帧">

    </div>`).join('') || '<p class="field-note">还 没 镜头 —— 点 上面 「加一个镜头」。</p>';
  $$('#v-shotlist-rows .v-shot-prompt').forEach(inp => {
    inp.oninput = e => {
      const i = parseInt(e.target.dataset.i, 10);
      if (vShots[i]) vShots[i].prompt = e.target.value;

  $$('#v-shotlist-rows .v-shot-pick').forEach(b => b.onclick = () => {

    f.dataset.idx = b.dataset.i; f.dataset.slot = b.dataset.slot; f.click();
  });
  $$('#v-shotlist-rows .v-shot-rm').forEach(b => b.onclick = () => {

function vidEstimate(steps, w, h, frames) {
  const p = (window.__props && window.__props.settings) || {};
  const rows = vidRows(w, h, frames);
  // 内核 的 调度器: 走 N 步 = N-1 次 前向 (最后 那 步 不 走)
  const fwd = Math.max(1, steps - 1);
  let sec = 0;
  const n = p.video_fit_n || 0;
  const a = n >= 2 ? p.video_fit_a : VID_FIT_DEFAULT.a;
  const b = n >= 2 ? p.video_fit_b : VID_FIT_DEFAULT.b;
  // 有 实测 且 尺寸 接近 那 次 实测 → 直接 用 实测 (最 准)
  if (p.last_video_sec_per_step && p.last_video_rows) {
    const k = rows / p.last_video_rows;
    if (k > 0.7 && k < 1.4) {
      sec = fwd * p.last_video_sec_per_step * (k >= 1 ? k * k : k);
    } else {
      sec = fwd * (a * rows + b * rows * rows);
    }
  } else {
    sec = fwd * (a * rows + b * rows * rows);
  }
  if (!(sec > 0)) return '';
  const m = sec / 60;
  const txt = m >= 1 ? `预计约 ${m < 10 ? m.toFixed(1) : Math.round(m)} 分钟` : `预计约 ${Math.round(sec)} 秒`;
  return `${txt}（${rows.toLocaleString()} 行 × ${fwd} 步）`;
}

          : '首尾帧 —— 在 下面 一 个 镜头 一 个 镜头 地 写：每 个 镜头 一 条 提示词 + 一 对 首帧/尾帧。';

        const clips = [];
        for (let i = 0; i < list.length; i++) {
          const sh = list[i];
