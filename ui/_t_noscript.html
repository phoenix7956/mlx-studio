<!doctype html>
<html lang="zh-CN" data-theme="light" data-accent="blue" data-textsize="default">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MLX Serve Studio</title>
<style>
:root{
  --sidebar-width:220px;
  --topbar-h:44px;
  --bg:#ffffff; --bg-2:#f9f9f9; --bg-3:#f1f1f1;
  --text:#262626; --text-2:#707070; --sep:#e8e8e8;
  --accent:#007aff; --ok:#30b94a; --pending:#bd7100; --error:#c52d29;
  --radius:10px;
  --fs-body:0.8125rem; --fs-title:1.625rem; --fs-section:0.9375rem;
  --fs-anno:0.6875rem; --fs-chat:0.875rem;
}
html[data-theme="dark"]{
  --bg:#1f1f21; --bg-2:#252528; --bg-3:#2c2c2e;
  --text:#e5e5e5; --text-2:#9a9a9a; --sep:#3a3a3c;
  --accent:#0a84ff; --ok:#30b94a; --pending:#bd7100; --error:#ff453a;
}
html[data-accent="purple"]{--accent:#8944e0}
html[data-accent="pink"]{--accent:#d6337c}
html[data-accent="red"]{--accent:#e03131}
html[data-accent="orange"]{--accent:#f76707}
html[data-accent="yellow"]{--accent:#f59f00}
html[data-accent="green"]{--accent:#2f9e44}
html[data-accent="graphite"]{--accent:#5c5c5c}
html[data-textsize="small"]{--fs-body:0.75rem;--fs-chat:0.8125rem;--fs-title:1.375rem}
html[data-textsize="large"]{--fs-body:0.875rem;--fs-chat:0.9375rem;--fs-title:1.75rem}
html[data-textsize="xlarge"]{--fs-body:0.9375rem;--fs-chat:1rem;--fs-title:2rem}

*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;background:var(--bg-3);color:var(--text);
  font-family:system-ui,-apple-system,"PingFang SC","Helvetica Neue",sans-serif;
  font-size:var(--fs-body);line-height:1.5;
}
button,input,textarea,select{font:inherit;color:inherit}
a{color:var(--accent)}
#app{display:grid;grid-template-columns:var(--sidebar-width) minmax(0,1fr);height:100vh}

/* ---------- 侧栏 ---------- */
.sidebar{
  background:var(--bg);border-right:1px solid var(--sep);
  display:flex;flex-direction:column;overflow-y:auto;
}
.brand{padding:16px 16px 10px;display:flex;align-items:baseline;gap:8px}
.wordmark{font-size:1.875rem;font-weight:700;letter-spacing:-1.7px;line-height:1.1}
.brand small{color:var(--text-2);font-size:var(--fs-anno)}
.nav{padding:6px 8px 16px;display:flex;flex-direction:column;gap:2px}
.nav .group{
  font-size:var(--fs-anno);color:var(--text-2);text-transform:uppercase;
  letter-spacing:.06em;padding:12px 10px 4px;
}
.nav button{
  display:flex;align-items:center;gap:9px;width:100%;text-align:left;
  padding:7px 10px;border:0;border-radius:8px;background:transparent;
  color:var(--text);cursor:pointer;
}
.nav button:hover{background:var(--bg-3)}
.nav button.active{background:var(--bg-3);color:var(--accent);font-weight:600}
.nav button .ic{width:16px;text-align:center;opacity:.85}
.side-foot{margin-top:auto;padding:10px 14px;border-top:1px solid var(--sep);font-size:var(--fs-anno);color:var(--text-2)}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--text-2);margin-right:6px;vertical-align:middle}
.dot.ok{background:var(--ok)} .dot.pending{background:var(--pending)} .dot.err{background:var(--error)}

/* ---------- 主区 ---------- */
.content{display:flex;flex-direction:column;min-width:0;background:var(--bg-3)}
.topbar{
  height:var(--topbar-h);flex:0 0 var(--topbar-h);display:flex;align-items:center;
  gap:12px;padding:0 16px;background:var(--bg);border-bottom:1px solid var(--sep);
}
.topbar h1{font-size:var(--fs-section);font-weight:600;margin:0}
.topbar .spacer{flex:1}
.topbar .chip{
  display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;
  background:var(--bg-3);font-size:var(--fs-anno);color:var(--text-2);
}
.iconbtn{
  width:30px;height:30px;border-radius:8px;border:1px solid transparent;background:transparent;
  cursor:pointer;display:inline-flex;align-items:center;justify-content:center;font-size:1rem;
}
.iconbtn:hover{background:var(--bg-3)}
.pages{flex:1;overflow-y:auto;padding:20px 22px 40px}
.page{display:none;max-width:1180px;margin:0 auto}
.page.active{display:block}
.page-title{font-size:var(--fs-title);font-weight:700;margin:0 0 4px;letter-spacing:-.4px}
.page-sub{color:var(--text-2);margin:0 0 18px;font-size:var(--fs-body)}

/* ---------- 卡片 / 面板 ---------- */
.card{background:var(--bg);border:1px solid var(--sep);border-radius:var(--radius);padding:14px 16px}
.grid{display:grid;gap:12px}
.grid.c4{grid-template-columns:repeat(4,minmax(0,1fr))}
.grid.c2{grid-template-columns:repeat(2,minmax(0,1fr))}
.grid.c3{grid-template-columns:repeat(3,minmax(0,1fr))}
.metric .label{font-size:var(--fs-anno);color:var(--text-2);text-transform:uppercase;letter-spacing:.05em}
.metric .value{font-size:1.5rem;font-weight:650;margin-top:4px;font-variant-numeric:tabular-nums}
.metric .note{font-size:var(--fs-anno);color:var(--text-2);margin-top:2px}
.section-title{font-size:var(--fs-section);font-weight:600;margin:22px 0 10px}

/* ---------- 对话 ---------- */
.chat-wrap{display:flex;flex-direction:column;height:100%}
.chat-scroll{flex:1;overflow-y:auto;padding:18px 22px 8px}
.welcome{max-width:640px;margin:6vh auto 0;text-align:center}
.welcome .wordmark{font-size:2rem}
.welcome h2{font-size:var(--fs-title);margin:14px 0 6px;font-weight:650}
.welcome p{color:var(--text-2);margin:0 0 18px}
.chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.chip-btn{
  border:1px solid var(--sep);background:var(--bg);border-radius:999px;
  padding:7px 14px;cursor:pointer;color:var(--text);
}
.chip-btn:hover{border-color:var(--accent);color:var(--accent)}
.msgs{max-width:820px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.msg{display:flex;gap:12px}
.msg .who{
  flex:0 0 30px;height:30px;border-radius:8px;display:flex;align-items:center;justify-content:center;
  background:var(--bg-3);font-size:var(--fs-anno);color:var(--text-2);
}
.msg.user .who{background:var(--accent);color:#fff}
.bubble{
  background:var(--bg);border:1px solid var(--sep);border-radius:var(--radius);
  padding:10px 13px;white-space:pre-wrap;word-break:break-word;font-size:var(--fs-chat);max-width:100%;
}
.msg.user .bubble{background:var(--bg-3);border-color:transparent}
.bubble.warn{color:var(--pending);border-color:rgba(189,113,0,.35);background:rgba(189,113,0,.06)}
.think{
  margin-bottom:8px;border-left:2px solid var(--sep);padding:4px 0 4px 10px;
  color:var(--text-2);font-size:var(--fs-anno);white-space:pre-wrap;max-height:190px;overflow:auto;
}
.think b{color:var(--text-2);font-weight:600}
.msg-foot{display:flex;gap:10px;margin-top:6px;font-size:var(--fs-anno);color:var(--text-2)}
.msg-foot button{border:0;background:none;color:var(--text-2);cursor:pointer;padding:0;font-size:var(--fs-anno)}
.msg-foot button:hover{color:var(--accent)}
.composer-wrap{padding:10px 22px 18px}
.composer{max-width:820px;margin:0 auto;background:var(--bg);border:1px solid var(--sep);border-radius:14px;padding:10px 12px}
.composer textarea{
  width:100%;border:0;outline:0;resize:none;background:transparent;min-height:46px;max-height:220px;font-size:var(--fs-chat);
}
.composer-bar{display:flex;align-items:center;gap:4px;margin-top:4px}
.composer-bar .spacer{flex:1}
.model-picker{
  display:inline-flex;align-items:center;gap:6px;border:1px solid var(--sep);background:var(--bg-2);
  border-radius:999px;padding:4px 10px;cursor:pointer;font-size:var(--fs-anno);
}
.send{
  width:36px;height:36px;border-radius:50%;border:0;background:var(--accent);color:#fff;
  display:inline-flex;align-items:center;justify-content:center;cursor:pointer;font-size:1rem;
}
.send:disabled{opacity:.4;cursor:not-allowed}
.toggle{
  display:inline-flex;align-items:center;gap:6px;border:1px solid var(--sep);background:var(--bg-2);
  border-radius:999px;padding:4px 10px;cursor:pointer;font-size:var(--fs-anno);color:var(--text-2);
}
.toggle.on{color:var(--accent);border-color:var(--accent)}
select,input[type=text],input[type=number],textarea.field{
  background:var(--bg-2);border:1px solid var(--sep);border-radius:8px;padding:7px 10px;outline:0;width:100%;
}
label.fld{display:block;margin-bottom:10px}
label.fld span{display:block;font-size:var(--fs-anno);color:var(--text-2);margin-bottom:4px}
.row{display:flex;gap:12px;flex-wrap:wrap}
.row>*{flex:1;min-width:180px}
button.primary{
  background:var(--accent);color:#fff;border:0;border-radius:8px;padding:8px 16px;cursor:pointer;font-weight:600;
}
button.ghost{
  background:var(--bg-2);border:1px solid var(--sep);border-radius:8px;padding:8px 14px;cursor:pointer;
}
button.ghost:hover{border-color:var(--accent);color:var(--accent)}
table{width:100%;border-collapse:collapse;font-size:var(--fs-body)}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--sep)}
th{color:var(--text-2);font-weight:600;font-size:var(--fs-anno);text-transform:uppercase;letter-spacing:.04em}
.badge{display:inline-block;padding:2px 8px;border-radius:999px;font-size:var(--fs-anno);background:var(--bg-3);color:var(--text-2)}
.badge.loaded{background:rgba(48,185,74,.15);color:var(--ok)}
.badge.absent{background:rgba(197,45,41,.12);color:var(--error)}
.badge.ready{background:rgba(189,113,0,.13);color:var(--pending)}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:var(--fs-anno)}
canvas.spark{width:100%;height:56px;display:block}
.media-item{border:1px solid var(--sep);border-radius:var(--radius);overflow:hidden;background:var(--bg)}
.media-item img,.media-item video{width:100%;display:block;background:#000}
.media-item .cap{padding:7px 10px;font-size:var(--fs-anno);color:var(--text-2)}
.toast{
  position:fixed;right:18px;bottom:18px;background:var(--text);color:var(--bg);
  padding:9px 14px;border-radius:8px;font-size:var(--fs-anno);opacity:0;transition:opacity .2s;pointer-events:none;
}
.toast.show{opacity:.95}
.spacer8{height:8px}
@media (max-width:900px){
  #app{grid-template-columns:1fr}
  .sidebar{position:fixed;inset:0 auto 0 0;width:var(--sidebar-width);z-index:20;transform:translateX(-100%);transition:transform .18s}
  .sidebar.open{transform:none}
  .grid.c4{grid-template-columns:repeat(2,minmax(0,1fr))}
  .grid.c3,.grid.c2{grid-template-columns:1fr}
}
</style>
</head>
<body>
<div id="app">
  <aside class="sidebar" id="sidebar">
    <div class="brand"><span class="wordmark">MLX-Serve</span><small>Studio</small></div>
    <nav class="nav" id="nav"></nav>
    <div class="side-foot">
      <div><span class="dot" id="side-dot"></span><span id="side-state">连接中…</span></div>
      <div class="mono" id="side-addr" style="margin-top:3px"></div>
    </div>
  </aside>
  <main class="content">
    <header class="topbar">
      <button class="iconbtn" id="menu-btn" title="菜单">☰</button>
      <h1 id="page-title">对话</h1>
      <div class="spacer"></div>
      <span class="chip" id="chip-model">模型 —</span>
      <span class="chip" id="chip-mem">内存 —</span>
      <button class="iconbtn" id="theme-btn" title="切换主题">◐</button>
    </header>
    <div class="pages" id="pages">
      <section class="page" id="page-chat"></section>
      <section class="page" id="page-monitor"></section>
      <section class="page" id="page-library"></section>
      <section class="page" id="page-models"></section>
      <section class="page" id="page-image"></section>
      <section class="page" id="page-video"></section>
      <section class="page" id="page-audio"></section>
      <section class="page" id="page-api"></section>
      <section class="page" id="page-settings"></section>
    </div>
  </main>
</div>
<div class="toast" id="toast"></div>

</body>
</html>
